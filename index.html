<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6d5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="佣金速記">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>佣金速記</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#efece5; --ink:#1b1d22; --muted:#6c6f77;
  --line:#e3dfd6; --accent:#2f6d5a; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --good:#1d8a57; --good-soft:#dff3e8; --bad:#cf3a3a; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 14px rgba(20,20,20,.05);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1b1e22; --surface2:#24282d; --ink:#eceae5; --muted:#9a9ea6;
    --line:#2e3238; --accent:#5fb394; --accent-ink:#0d1a15; --accent-soft:#1d3a30;
    --good:#4cc488; --good-soft:#163527; --bad:#ff6b63; --bad-soft:#3d1c1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e22; --surface2:#24282d; --ink:#eceae5; --muted:#9a9ea6;
  --line:#2e3238; --accent:#5fb394; --accent-ink:#0d1a15; --accent-soft:#1d3a30;
  --good:#4cc488; --good-soft:#163527; --bad:#ff6b63; --bad-soft:#3d1c1b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;min-height:100dvh;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-weight:800;font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:#fff1cc;color:#7a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{background:#3a3110;color:#f3d77a}}

/* cards / sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:600;font-size:15px;transition:all .12s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.c-cht[aria-pressed="true"]{background:#1f5fbf;border-color:#1f5fbf;color:#fff}
.chip.c-twm[aria-pressed="true"]{background:#e8710a;border-color:#e8710a;color:#fff}
.chip.c-fet[aria-pressed="true"]{background:#d11f3a;border-color:#d11f3a;color:#fff}
.chip.sm{min-height:34px;padding:5px 11px;font-size:14px;border-radius:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
details.plans summary{list-style:none;cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;padding:4px 0}
details.plans summary::-webkit-details-marker{display:none}
.plan-group{margin-top:10px}
.plan-group h4{margin:0 0 6px;font-size:13px;color:var(--muted)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  border-radius:14px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);
}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:15px;width:auto;padding:0 16px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.15s;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}

/* bottom nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.qbar .x{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.prog{flex:1;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .25s}
.qcount{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:20px 18px 18px;position:relative;overflow:hidden;margin-bottom:14px;
}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc,var(--accent))}
.carrier{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--cc)}
.carrier::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.qplan{font-size:32px;font-weight:800;line-height:1.2;margin:6px 0 12px;letter-spacing:.5px}
.qtags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:17px;font-weight:700;padding:6px 14px;border-radius:10px;background:var(--surface2)}
.tag.t0{background:#e3edff;color:#1d4fa3}
.tag.t1{background:#e4f5ea;color:#1c7a47}
.tag.t2{background:#f6ebff;color:#7a3aa8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag.t0{background:#1c2a44;color:#9cc0ff}
  :root:not([data-theme="light"]) .tag.t1{background:#17352a;color:#8fdcb0}
  :root:not([data-theme="light"]) .tag.t2{background:#33213f;color:#d6a8f5}
}
.qask{margin-top:14px;font-size:15px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  min-height:68px;border-radius:16px;background:var(--surface);border:2px solid var(--line);
  font-size:24px;font-weight:800;box-shadow:var(--shadow);transition:transform .08s,background .12s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.opt small{font-size:13px;font-weight:600;color:var(--muted)}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:16px 2px 10px}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.next-dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:15}
.next-dock .btn{max-width:488px;margin:0 auto}

/* tables */
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.rt th,.rt td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.rt th{font-size:12px;color:var(--muted);font-weight:700}
.rt td:first-child,.rt th:first-child{text-align:left;color:var(--muted);font-weight:600;font-size:14px}
.rt tr:last-child td{border-bottom:0}
.rt td.v{font-weight:700}
.rt td.hl{background:var(--accent-soft);color:var(--accent);border-radius:8px;outline:2px solid var(--accent);outline-offset:-2px}
.rt td.na{color:var(--muted);font-weight:400}
.rt td.cover{cursor:pointer}
.rt td.cover span{display:inline-block;min-width:52px;border-radius:6px;background:var(--surface2);color:transparent;user-select:none}
.plan-card h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}

/* lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-title{font-weight:700}
.li-sub{font-size:13px;color:var(--muted)}
.li-ans{font-weight:800;font-size:18px}
.badge-n{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}

.big-stat{display:flex;gap:10px}
.big-stat div{flex:1;background:var(--surface2);border-radius:14px;padding:12px;text-align:center}
.big-stat b{display:block;font-size:26px}
.big-stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:10px}
.stat-row{padding:10px 0}

/* lock */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:420px;margin:0 auto}
.lock .logo{width:72px;height:72px;border-radius:20px;background:var(--accent);display:grid;place-items:center;margin-bottom:18px}
.lock h1{margin:0 0 4px;font-size:26px}
.lock p{margin:0 0 22px;color:var(--muted)}
.field{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;padding:0 16px;margin-bottom:12px;outline:none}
.field:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:-4px 0 8px}
.summary-score{text-align:center;padding:10px 0 4px}
.summary-score b{font-size:56px;line-height:1}
.summary-score div{color:var(--muted)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
.qbar .x{color:var(--muted)}
.hist-item{border-bottom:1px solid var(--line);padding:12px 0}
.hist-item:last-child{border-bottom:0}
.hist-item summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item .when{flex:1;font-size:14px;color:var(--muted)}
.hist-item .sc{font-weight:800;font-size:18px}
.hist-item .pct{min-width:52px;text-align:right;font-weight:700;font-size:14px;padding:2px 8px;border-radius:99px}
.pct.hi{background:var(--good-soft);color:var(--good)}
.pct.mid{background:#fff1cc;color:#7a5a00}
.pct.lo{background:var(--bad-soft);color:var(--bad)}
.hist-item .li-sub{margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);min-height:40px}
.restart{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted);flex:none;white-space:nowrap}
.restart.armed{background:var(--bad-soft);color:var(--bad)}
.big-stat span{white-space:nowrap}
@media (max-width:360px){.big-stat{gap:6px}.big-stat div{padding:10px 4px}.big-stat b{font-size:22px}.qcount{font-size:13px}}
.mode-seg{margin:-4px 0 12px}
.mode-seg button{min-height:32px;font-size:13px}
.tag.retry{font-size:12px;padding:3px 10px;background:#fff1cc;color:#7a5a00}
.trap{background:#fff4e0;border:1px solid #f0c98a;color:#7a4b00;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.trap b{display:block;margin-bottom:2px}
.rt td.tp{position:relative}
.rt td.tp::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#e08a00}
.ans-form{display:flex;gap:10px}
.ans-in{flex:1;margin:0;font-size:26px;font-weight:800;text-align:center;min-height:64px}
.ans-form .btn{width:96px;min-height:64px}
.ans-in.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ans-in.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.trap-mini,.mode-mini{font-size:11px;padding:1px 6px;border-radius:6px;background:#fff1cc;color:#7a5a00;font-weight:700;vertical-align:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trap{background:#33270f;border-color:#6b5020;color:#f3cf86}
 :root:not([data-theme="light"]) .tag.retry,:root:not([data-theme="light"]) .trap-mini,:root:not([data-theme="light"]) .mode-mini{background:#3a3110;color:#f3d77a}}
.qtop{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.scope{flex:1;min-width:0;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.scope span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar2{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:20px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .lv-main{flex:1;min-width:0}
.lv b{display:block;font-size:16px}
.lv small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.lv .st{font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.lv .st.ok{color:var(--good)}
.linkbtn{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;min-height:36px}
.pass-banner{background:var(--good-soft);color:var(--good);border-radius:14px;padding:14px;font-weight:700;margin-bottom:14px}
.pass-banner small{display:block;font-weight:500;margin-top:4px;color:var(--ink)}
.prog-note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.lv-row{padding:10px 0;border-bottom:1px solid var(--line)}
.lv-row:last-child{border-bottom:0}
.hist-item .when{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.mode-mini,.trap-mini{white-space:nowrap}
.scope-mini{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:700;vertical-align:2px;white-space:nowrap}
</style>
</head>
<body>

<!-- 密碼鎖 -->
<section id="lock" class="lock hidden">
  <div class="logo"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>佣金速記</h1>
  <p>請輸入密碼解鎖</p>
  <form id="lockForm" autocomplete="off">
    <input id="pw" class="field" type="password" inputmode="numeric" placeholder="密碼" autocomplete="current-password">
    <div id="pwErr" class="err"></div>
    <label class="switch" style="margin-bottom:14px"><span>記住這台裝置</span><input id="remember" type="checkbox" checked></label>
    <button class="btn" type="submit" id="unlockBtn">解鎖</button>
  </form>
</section>

<!-- 作答畫面 -->
<section id="quiz" class="hidden">
  <div class="wrap">
    <div class="qtop">
      <button class="x" id="histBtn" aria-label="過往紀錄"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
      <button class="scope" id="scopeBtn" aria-label="練習範圍"><span id="scopeTxt"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="restart" id="restartBtn" aria-label="重新開始"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span id="restartTxt">重來</span></button>
    </div>
    <div class="qbar2"><div class="prog"><i id="progBar"></i></div><div class="qcount num" id="qCount"></div></div>
    <div class="seg mode-seg" id="modeSeg"></div>
    <div id="qBody"></div>
  </div>
  <div class="next-dock hidden" id="nextDock"><button class="btn" id="nextBtn">下一題</button></div>
</section>

<!-- 結算 -->
<section id="summary" class="hidden"><div class="wrap" id="summaryBody"></div></section>

<!-- 過往紀錄 -->
<section id="history" class="hidden"><div class="wrap" id="historyBody"></div></section>

<!-- 練習範圍 -->
<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-label="練習範圍"></div></div>

<script src="data.enc.js"></script>
<script>
(() => {
"use strict";
const TYPES = ["攜碼", "新辦", "續約"];
const PERIODS = ["24", "30", "36", "48"];
const ROUND = 20;
const AUTO_NEXT_MS = 1200;
const RETRY_MAX = 2;        // 同一題在同一輪最多重考次數
const TRAP_P = 0.5;         // 同格位有陷阱格時，優先抽陷阱格的機率
const PASS_SCORE = 18;      // 過關門檻：20 題首答對 18 題（90%）
const PASS_STREAK = 2;      // 需連續幾輪

const LEVELS = [
  { id: 1, name: "核心", desc: "5G-599／799／999・24、30 期" },
  { id: 2, name: "進階", desc: "5G-1099～1399 全部期數，及 599～999 的 36、48 期" },
  { id: 3, name: "高資費", desc: "5G-1499 以上" }
];
const LEVEL_NAME = { 1: "核心層", 2: "進階層", 3: "高資費層", all: "三層混合" };
// 每輪組成：[層級, 題數]
const MIX = { 1: [[1, 20]], 2: [[2, 14], [1, 6]], 3: [[3, 14], [1, 3], [2, 3]], all: [[1, 10], [2, 6], [3, 4]] };
const CA_SHORT = { all: "三家", twm: "台灣大", cht: "中華", fet: "遠傳" };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => (a && a.length ? a[Math.floor(Math.random() * a.length)] : null);
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (t) => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const sgn = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
const priceOf = (name) => { const m = String(name).match(/(\d{3,5})(?!.*\d{3,5})/); return m ? Number(m[1]) : 0; };

let DATA = null, ITEMS = [], BYKEY = {};
let hist = LS.get("cq_hist", []);                 // 每輪：{at, c, n, w, m, r, lv, ca}
let itemStat = LS.get("cq_item", {});             // 每格首答紀錄：key → [作答次數, 答對次數, 最近一次是否答對]
let lvProg = LS.get("cq_lv", null);               // 各層過關進度
let scope = LS.get("cq_scope", { lv: 1, ca: "all" });
let mode = LS.get("cq_mode", "choice");
let session = null;
const defaultProg = () => ({ 1: { passed: false, streak: 0 }, 2: { passed: false, streak: 0 }, 3: { passed: false, streak: 0 }, skip: false });
if (!lvProg) lvProg = defaultProg();

/* ---------- 解密 ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const E = window.ENC_DATA, enc = new TextEncoder();
  const bk = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(E.salt), iterations: E.iter || 200000, hash: "SHA-256" },
    bk, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function boot() {
  if (!window.ENC_DATA) return showLockError("找不到資料檔 data.enc.js");
  if (!window.crypto || !crypto.subtle) return showLockError("此網址不支援加密功能，請用 https 網址開啟");
  const saved = LS.get("cq_pw", null);
  if (saved) { try { DATA = await decrypt(saved); return start(); } catch (e) { LS.del("cq_pw"); } }
  $("#lock").classList.remove("hidden");
  setTimeout(() => $("#pw").focus(), 50);
}
function showLockError(msg) { $("#lock").classList.remove("hidden"); $("#pwErr").textContent = msg; }
$("#lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  $("#unlockBtn").disabled = true; $("#unlockBtn").textContent = "解鎖中…";
  try {
    DATA = await decrypt(pw);
    if ($("#remember").checked) LS.set("cq_pw", pw);
    $("#lock").classList.add("hidden");
    start();
  } catch (err) {
    $("#pwErr").textContent = "密碼錯誤";
    $("#lockForm").classList.remove("shake"); void $("#lockForm").offsetWidth; $("#lockForm").classList.add("shake");
  }
  $("#unlockBtn").disabled = false; $("#unlockBtn").textContent = "解鎖";
});

/* ---------- 資料整理 ---------- */
const keyOf = (c, p, per, t) => `${c.id}|${p.name}|${per}|${t}`;
function levelOf(it) {
  const pr = priceOf(it.p.name);
  if ([599, 799, 999].includes(pr) && (it.per === "24" || it.per === "30")) return 1;
  return pr <= 1399 ? 2 : 3;
}
function buildItems() {
  ITEMS = []; BYKEY = {};
  for (const c of DATA.carriers) for (const p of c.plans) for (const per of PERIODS) {
    const r = p.rates[per]; if (!r) continue;
    r.forEach((v, t) => {
      if (v === null || v === undefined || v === "") return;
      const it = { key: keyOf(c, p, per, t), c, p, per, t, ans: Number(v), trap: [] };
      it.lv = levelOf(it);
      ITEMS.push(it); BYKEY[it.key] = it;
    });
  }
  detectTraps();
}

/* ---------- 陷阱格偵測 ----------
   先統計資料的多數規律，再把例外或數字相同（容易搞混）的格子標成陷阱格：
   1. 同期數內三種類型的大小順序　2. 期數越長佣金的增減方向　3. 同電信同格位，資費越高佣金的增減方向 */
function detectTraps() {
  const flag = (c, p, per, t, msg) => { const it = BYKEY[keyOf(c, p, per, t)]; if (it && !it.trap.includes(msg)) it.trap.push(msg); };
  const pairs = [[0, 1], [1, 2], [0, 2]];
  // 至少 80% 的資料都符合，才當成規律（否則不算陷阱，例如新辦和續約的高低各半）
  const ruleDir = (s, n) => (n && Math.abs(s) >= 0.6 * n ? sgn(s) : 0);
  const tdir = {};
  for (const [a, b] of pairs) {
    let s = 0, n = 0;
    for (const c of DATA.carriers) for (const p of c.plans) for (const per of PERIODS) {
      const r = p.rates[per]; if (r && r[a] != null && r[b] != null && r[a] !== r[b]) { s += sgn(r[a] - r[b]); n++; }
    }
    tdir[a + "" + b] = ruleDir(s, n);
  }
  const periodPairs = (p, t) => {
    const out = []; let prev = null;
    for (const per of PERIODS) { const r = p.rates[per]; if (!r || r[t] == null) continue; if (prev) out.push([prev, per]); prev = per; }
    return out;
  };
  let ps = 0, pn = 0;
  for (const c of DATA.carriers) for (const p of c.plans) for (let t = 0; t < 3; t++)
    for (const [p1, p2] of periodPairs(p, t)) { const d = sgn(p.rates[p2][t] - p.rates[p1][t]); if (d) { ps += d; pn++; } }
  const pdir = ruleDir(ps, pn);
  const sortedPlans = (c) => c.plans.filter((p) => priceOf(p.name)).sort((x, y) => priceOf(x.name) - priceOf(y.name));
  let fs = 0, fn = 0;
  for (const c of DATA.carriers) { const sp = sortedPlans(c);
    for (let i = 1; i < sp.length; i++) for (const per of PERIODS) for (let t = 0; t < 3; t++) {
      const a = sp[i - 1].rates[per], b = sp[i].rates[per];
      if (a && b && a[t] != null && b[t] != null && a[t] !== b[t]) { fs += sgn(b[t] - a[t]); fn++; }
    } }
  const fdir = ruleDir(fs, fn);
  for (const c of DATA.carriers) {
    for (const p of c.plans) for (const per of PERIODS) {
      const r = p.rates[per]; if (!r) continue;
      for (const [a, b] of pairs) {
        const x = r[a], y = r[b], d = tdir[a + "" + b];
        if (x == null || y == null) continue;
        if (x === y) { const m = `${per} 期的${TYPES[a]}和${TYPES[b]}一樣都是 ${x}`; flag(c, p, per, a, m); flag(c, p, per, b, m); }
        else if (d && sgn(x - y) === -d) {
          const [hi, lo, vh, vl] = x > y ? [a, b, x, y] : [b, a, y, x];
          const m = `${per} 期的${TYPES[hi]} ${vh} 反而比${TYPES[lo]} ${vl} 高`;
          flag(c, p, per, a, m); flag(c, p, per, b, m);
        }
      }
    }
    for (const p of c.plans) for (let t = 0; t < 3; t++) for (const [p1, p2] of periodPairs(p, t)) {
      const v1 = p.rates[p1][t], v2 = p.rates[p2][t];
      if (v1 === v2) { const m = `${TYPES[t]}的 ${p1} 期和 ${p2} 期一樣都是 ${v1}`; flag(c, p, p1, t, m); flag(c, p, p2, t, m); }
      else if (pdir && sgn(v2 - v1) === -pdir) { const m = `${TYPES[t]}的 ${p2} 期 ${v2} 反而比 ${p1} 期 ${v1} ${v2 < v1 ? "低" : "高"}`; flag(c, p, p1, t, m); flag(c, p, p2, t, m); }
    }
    const sp = sortedPlans(c);
    if (fdir) for (let i = 1; i < sp.length; i++) for (const per of PERIODS) for (let t = 0; t < 3; t++) {
      const lo = sp[i - 1], hi = sp[i], a = lo.rates[per], b = hi.rates[per];
      if (!a || !b || a[t] == null || b[t] == null) continue;
      if (a[t] === b[t]) {
        flag(c, lo, per, t, `和更高資費的 ${hi.name} 一樣都是 ${a[t]}`);
        flag(c, hi, per, t, `和較低資費的 ${lo.name} 一樣都是 ${b[t]}`);
      } else if (sgn(b[t] - a[t]) === -fdir) {
        flag(c, lo, per, t, `比更高資費的 ${hi.name}（${b[t]}）還${a[t] > b[t] ? "高" : "低"}`);
        flag(c, hi, per, t, `比較低資費的 ${lo.name}（${a[t]}）還${b[t] < a[t] ? "低" : "高"}`);
      }
    }
  }
}

function start() {
  // 第一次載入正式資料時，清掉測試資料留下的紀錄
  const prevId = LS.get("cq_dataid", null);
  if (prevId !== DATA.id) {
    if (!prevId) { hist = []; itemStat = {}; lvProg = defaultProg(); LS.set("cq_hist", hist); LS.set("cq_item", itemStat); LS.set("cq_lv", lvProg); }
    LS.set("cq_dataid", DATA.id || "");
  }
  buildItems();
  if (!isUnlocked(scope.lv)) scope = { lv: 1, ca: scope.ca || "all" };
  if (scope.ca !== "all" && !DATA.carriers.some((c) => c.id === scope.ca)) scope.ca = "all";
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  startRound();
}

/* ---------- 層級與範圍 ---------- */
function isUnlocked(lv) {
  if (lvProg.skip) return true;
  if (lv === 1) return true;
  if (lv === 2) return lvProg[1].passed;
  if (lv === 3) return lvProg[2].passed;
  return lvProg[1].passed && lvProg[2].passed && lvProg[3].passed;   // 三層混合
}
const poolOf = (lv, ca) => ITEMS.filter((it) => it.lv === lv && (ca === "all" || it.c.id === ca));
const scopeLabel = (s) => `${LEVEL_NAME[s.lv]}・${CA_SHORT[s.ca]}`;

/* ---------- 平均抽題 ----------
   在指定題庫內，讓電信、期數、類型的題數盡量平均，同電信的方案輪流出現；
   同格位有陷阱格時有一半機率優先抽陷阱格。不參考過往紀錄。 */
function spread(list, n) { let out = []; while (out.length < n) out = out.concat(shuffle(list)); return shuffle(out.slice(0, n)); }
function buildFrom(pool, n) {
  if (!pool.length || n <= 0) return [];
  const cars = [...new Set(pool.map((x) => x.c))], pers = [...new Set(pool.map((x) => x.per))], typs = [...new Set(pool.map((x) => x.t))];
  const cs = spread(cars, n), ps = spread(pers, n), ts = spread(typs, n);
  const planQ = new Map(), used = new Set(), out = [];
  const free = (x) => !used.has(x.key);
  for (let i = 0; i < n; i++) {
    const c = cs[i], per = ps[i], t = ts[i];
    let it = null;
    const cands = pool.filter((x) => x.c === c && x.per === per && x.t === t && free(x));
    if (cands.length) {
      const traps = cands.filter((x) => x.trap.length);
      if (traps.length && Math.random() < TRAP_P) it = pick(traps);
      else {
        let q = planQ.get(c);
        if (!q || !q.length) { q = shuffle([...new Set(pool.filter((x) => x.c === c).map((x) => x.p))]); planQ.set(c, q); }
        for (let j = 0; j < q.length && !it; j++) { const f = cands.find((x) => x.p === q[j]); if (f) { it = f; q.splice(j, 1); } }
        if (!it) it = pick(cands);
      }
    }
    if (!it) it = pick(pool.filter((x) => x.c === c && x.t === t && free(x)));
    if (!it) it = pick(pool.filter((x) => x.c === c && free(x)));
    if (!it) it = pick(pool.filter(free));
    if (!it) { used.clear(); it = pick(pool.filter((x) => !out.length || x.key !== out[out.length - 1].key)) || pick(pool); }
    used.add(it.key); out.push(it);
  }
  return out;
}
function buildRound(sc) {
  let list = [];
  for (const [lv, n] of MIX[sc.lv]) {
    const pool = poolOf(lv, sc.ca);
    list = list.concat(buildFrom(pool, n).map((it) => ({ it, review: lv !== sc.lv && sc.lv !== "all" })));
  }
  // 題數不足 20 時（例如某層題庫是空的），從本範圍其他題補足
  if (list.length < ROUND) {
    const all = ITEMS.filter((it) => sc.ca === "all" || it.c.id === sc.ca);
    list = list.concat(buildFrom(all, ROUND - list.length).map((it) => ({ it, review: false })));
  }
  list = shuffle(list);
  for (let i = 1; i < list.length; i++) if (list[i].it.key === list[i - 1].it.key) { const j = (i + 2) % list.length; [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}

function makeOptions(it) {
  const ans = it.ans, seen = new Set([ans]), pick3 = [];
  const add = (v) => { v = Number(v); if (!(v > 0) || seen.has(v)) return; seen.add(v); pick3.push(v); };
  const samePlan = [];
  for (const per of PERIODS) { const r = it.p.rates[per]; if (r) r.forEach((v) => { if (v != null) samePlan.push(Number(v)); }); }
  for (const v of shuffle(samePlan)) { if (pick3.length >= 2) break; add(v); }
  // 其他電信同方案同格位（最容易混淆）＋同電信其他方案同格位
  const sameSlot = [];
  for (const c of DATA.carriers) for (const p of c.plans) {
    if (p === it.p) continue;
    if (c !== it.c && p.name !== it.p.name) continue;
    const r = p.rates[it.per]; if (r && r[it.t] != null) sameSlot.push(Number(r[it.t]));
  }
  for (const v of shuffle(sameSlot)) { if (pick3.length >= 3) break; add(v); }
  const step = ans >= 5000 ? 500 : ans >= 1000 ? 100 : 50;
  for (const k of shuffle([1, -1, 2, -2, 3, -3, 4, -4, 5])) { if (pick3.length >= 3) break; add(ans + k * step); }
  return shuffle([ans, ...pick3.slice(0, 3)]);
}

/* ---------- 作答 ---------- */
function show(id) { ["#quiz", "#summary", "#history"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); $("#nextDock").classList.add("hidden"); window.scrollTo(0, 0); }

function startRound() {
  if (restartArm) disarmRestart();
  clearTimeout(autoTimer);
  // orig：本輪 20 題；pending：待重考 {it, due}；step：已作答題數
  session = { scope: { ...scope }, orig: buildRound(scope), oi: 0, pending: [], step: 0, q: null, firstOk: 0, firstWrong: [], retryAsk: 0, retryOk: 0, retryCount: {}, cur: null, answered: false, modes: new Set() };
  $("#scopeTxt").textContent = scopeLabel(scope);
  show("#quiz");
  renderQuestion();
}
function nextQ() {
  const s = session;
  const due = s.pending.filter((x) => x.due <= s.step).sort((x, y) => x.due - y.due)[0];
  if (due) { s.pending.splice(s.pending.indexOf(due), 1); return { it: due.it, retry: true }; }
  if (s.oi < s.orig.length) { const o = s.orig[s.oi++]; return { it: o.it, retry: false, review: o.review }; }
  if (s.pending.length) { s.pending.sort((x, y) => x.due - y.due); return { it: s.pending.shift().it, retry: true }; }
  return null;
}
const progress = (extra) => { const s = session, left = (s.orig.length - s.oi) + s.pending.length + 1; return ((s.step + extra) / (s.step + left)) * 100; };
const roundDone = () => session.oi >= session.orig.length && !session.pending.length;

function renderModeSeg() {
  $("#modeSeg").innerHTML = `<button data-m="choice" aria-pressed="${mode === "choice"}">四選一</button><button data-m="input" aria-pressed="${mode === "input"}">輸入數字</button>`;
}
$("#modeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.m === mode) return;
  mode = b.dataset.m; LS.set("cq_mode", mode); renderModeSeg();
  if (session && !session.answered) renderQuestion(true);
});

function renderQuestion(keep) {
  const s = session;
  if (!keep || !s.q) { s.q = nextQ(); s.cur = { it: s.q.it, opts: makeOptions(s.q.it) }; }
  const q = s.q, it = q.it;
  s.answered = false;
  renderModeSeg();
  const wait = s.pending.length;
  $("#qCount").textContent = q.retry ? `重考中 · ${s.oi} / ${ROUND}` : `${s.oi} / ${ROUND}${wait ? ` · 待重考 ${wait}` : ""}`;
  $("#progBar").style.width = `${progress(0)}%`;
  const answerArea = mode === "choice"
    ? `<div class="opts">${s.cur.opts.map((v, i) => `<button class="opt num" data-i="${i}">${v}</button>`).join("")}</div>`
    : `<form class="ans-form" id="ansForm" autocomplete="off"><input id="ansIn" class="field num ans-in" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="輸入佣金" enterkeyhint="done"><button class="btn" type="submit">確定</button></form>`;
  const badge = q.retry ? `<span class="tag retry">重考</span>` : q.review ? `<span class="tag retry">複習</span>` : "";
  $("#qBody").innerHTML = `
    <div class="qcard pop" style="--cc:${esc(it.c.color)}">
      <div class="row-between"><div class="carrier">${esc(it.c.name)}</div>${badge}</div>
      <div class="qplan">${esc(it.p.name)}</div>
      <div class="qtags"><span class="tag">${it.per} 期</span><span class="tag t${it.t}">${TYPES[it.t]}</span></div>
      <div class="qask">佣金是多少？</div>
    </div>
    ${answerArea}
    <div id="reveal"></div>`;
  $("#nextDock").classList.add("hidden");
  window.scrollTo(0, 0);
  if (mode === "input") {
    const inp = $("#ansIn");
    setTimeout(() => inp.focus(), 30);
    $("#ansForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = inp.value.replace(/\D/g, "");
      if (!v || session.answered) return;
      answer(Number(v));
    });
  }
}
function rateTable(c, p, hl) {
  let h = `<table class="rt num"><thead><tr><th>期數</th>${TYPES.map((t) => `<th>${t}</th>`).join("")}</tr></thead><tbody>`;
  for (const per of PERIODS) {
    const r = p.rates[per];
    h += `<tr><td>${per} 期</td>`;
    for (let t = 0; t < 3; t++) {
      const v = r ? r[t] : null, isHl = hl && hl.per === per && hl.t === t;
      const it = v == null ? null : BYKEY[keyOf(c, p, per, t)];
      const tp = it && it.trap.length ? " tp" : "";
      h += v == null ? `<td class="na">—</td>` : `<td class="v${isHl ? " hl" : ""}${tp}">${v}</td>`;
    }
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}

$("#qBody").addEventListener("click", (e) => {
  const b = e.target.closest(".opt"); if (!b || session.answered) return;
  answer(session.cur.opts[Number(b.dataset.i)], Number(b.dataset.i));
});
document.addEventListener("keydown", (e) => {
  if ($("#quiz").classList.contains("hidden") || !session || !$("#sheetBg").classList.contains("hidden")) return;
  if (!session.answered && mode === "choice" && ["1", "2", "3", "4"].includes(e.key)) { const i = Number(e.key) - 1; answer(session.cur.opts[i], i); }
  else if (session.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); goNext(); }
});

let autoTimer = null;
function answer(value, chosenIdx) {
  const s = session, { it, opts } = s.cur, q = s.q;
  s.answered = true;
  s.modes.add(mode);
  const ok = Number(value) === it.ans;
  if (q.retry) { s.retryAsk++; if (ok) s.retryOk++; }
  else {
    if (ok) s.firstOk++; else s.firstWrong.push(it);
    const st = itemStat[it.key] || [0, 0, 0];
    st[0]++; if (ok) st[1]++; st[2] = ok ? 1 : 0;
    itemStat[it.key] = st; LS.set("cq_item", itemStat);
  }
  let requeued = false;
  if (!ok) {
    const n = s.retryCount[it.key] || 0;
    if (n < RETRY_MAX) { s.retryCount[it.key] = n + 1; s.pending.push({ it, due: s.step + 1 + 3 + Math.floor(Math.random() * 3) }); requeued = true; }
  }
  if (mode === "choice" && chosenIdx !== undefined) {
    document.querySelectorAll(".opt").forEach((el, j) => {
      el.disabled = true;
      if (opts[j] === it.ans) el.classList.add("ok"); else if (j === chosenIdx) el.classList.add("ng"); else el.classList.add("dim");
    });
  } else {
    const inp = $("#ansIn"); if (inp) { inp.disabled = true; inp.classList.add(ok ? "ok" : "ng"); }
    const btn = document.querySelector("#ansForm .btn"); if (btn) btn.classList.add("hidden");
    if (document.activeElement) document.activeElement.blur();
  }
  const verdict = ok
    ? `<div class="verdict ok">✓ 答對了！　正確答案 <span class="num">${it.ans}</span></div>`
    : `<div class="verdict ng">✗ ${mode === "input" ? `你填 <span class="num">${value}</span>　` : ""}正確答案 <span class="num">${it.ans}</span></div>`;
  $("#reveal").innerHTML = `
    ${verdict}
    ${it.trap.length ? `<div class="trap"><b>⚠ 陷阱格</b>${it.trap.map((m) => `<div>${esc(m)}</div>`).join("")}</div>` : ""}
    ${requeued ? `<div class="hint" style="text-align:left;margin:0 2px 10px">這題稍後會再考一次</div>` : ""}
    <div class="card plan-card"><h3><span class="carrier" style="--cc:${esc(it.c.color)}">${esc(it.c.name)}</span> ${esc(it.p.name)}</h3>${rateTable(it.c, it.p, it)}</div>`;
  $("#progBar").style.width = `${progress(1)}%`;
  $("#nextBtn").textContent = roundDone() ? "看結果" : "下一題";
  $("#nextDock").classList.remove("hidden");
  clearTimeout(autoTimer);
  if (ok) autoTimer = setTimeout(goNext, AUTO_NEXT_MS);
}
function goNext() {
  clearTimeout(autoTimer);
  if (!session || !session.answered) return;
  session.step++;
  if (roundDone()) endRound(); else renderQuestion();
}
$("#nextBtn").addEventListener("click", goNext);

/* ---------- 結算、過關判定 ---------- */
function endRound() {
  const s = session, sc = s.scope;
  const pure = s.modes.size === 1 && s.modes.has("input");
  const mcode = s.modes.size > 1 ? "x" : s.modes.has("input") ? "i" : "c";
  hist.push({ at: Date.now(), c: s.firstOk, n: ROUND, w: s.firstWrong.map((it) => it.key), m: mcode, r: [s.retryOk, s.retryAsk], lv: sc.lv, ca: sc.ca });
  LS.set("cq_hist", hist);
  // 過關：三家範圍、全程輸入數字模式、首答 18 題以上，連續兩輪
  let passMsg = "", justPassed = false;
  if (typeof sc.lv === "number") {
    const L = lvProg[sc.lv];
    if (sc.ca === "all" && pure) {
      if (s.firstOk >= PASS_SCORE) L.streak++; else L.streak = 0;
      if (!L.passed && L.streak >= PASS_STREAK) { L.passed = true; justPassed = true; }
      LS.set("cq_lv", lvProg);
      passMsg = L.passed && !justPassed ? `${LEVEL_NAME[sc.lv]}已過關` : `過關進度：連續 ${Math.min(L.streak, PASS_STREAK)} ／ ${PASS_STREAK} 輪達到 ${PASS_SCORE} 題以上`;
    } else if (!L.passed) {
      passMsg = sc.ca !== "all" ? "這輪是單一電信練習，不計入過關" : "這輪有使用四選一，不計入過關（過關需全程輸入數字）";
    }
  }
  const nextLv = sc.lv === 1 ? 2 : sc.lv === 2 ? 3 : "all";
  const pct = Math.round((s.firstOk / ROUND) * 100);
  const modeName = mcode === "x" ? "混合模式" : mcode === "i" ? "輸入數字" : "四選一";
  $("#summaryBody").innerHTML = `
    <div class="top"><div class="brand">本輪結果<small>${esc(scopeLabel(sc))}・${modeName}</small></div></div>
    ${justPassed ? `<div class="pass-banner">🎉 ${LEVEL_NAME[sc.lv]}過關！<small>已解鎖「${LEVEL_NAME[nextLv]}」${nextLv === "all" ? "，之後可以三層混合維持記憶" : "，之後每輪 14 題新內容＋6 題複習"}</small></div>` : ""}
    <div class="card pop"><div class="summary-score num"><b>${s.firstOk}<span style="font-size:24px"> / ${ROUND}</span></b><div>首次作答正確率 ${pct}%</div>
      ${s.retryAsk ? `<div style="margin-top:6px">重考 ${s.retryAsk} 題，答對 ${s.retryOk} 題</div>` : ""}</div>
      ${passMsg ? `<div class="prog-note">${passMsg}</div>` : ""}</div>
    ${justPassed ? `<button class="btn" id="sNext" style="margin-bottom:10px">前往${LEVEL_NAME[nextLv]}</button>` : ""}
    <button class="btn ${justPassed ? "ghost" : ""}" id="sAgain" style="margin-bottom:14px">再來一輪（20 題）</button>
    ${s.firstWrong.length ? `<div class="card"><p class="sec-title">這輪答錯（${s.firstWrong.length}）</p>${s.firstWrong.map(itemRow).join("")}</div>` : `<div class="card empty"><b>🎉</b>全部答對！</div>`}
    <button class="btn ghost" id="sHist">查看過往紀錄與層級進度</button>`;
  show("#summary");
  $("#sAgain").onclick = startRound;
  $("#sHist").onclick = () => renderHistory("#summary");
  const sn = $("#sNext"); if (sn) sn.onclick = () => { scope = { lv: nextLv, ca: "all" }; LS.set("cq_scope", scope); startRound(); };
}
function itemRow(it) {
  return `<div class="list-item">
    <div class="li-main"><div class="li-title"><span class="carrier" style="--cc:${esc(it.c.color)}">${esc(it.c.name)}</span> ${esc(it.p.name)}${it.trap.length ? ` <span class="trap-mini">陷阱</span>` : ""}</div>
    <div class="li-sub">${it.per} 期 · ${TYPES[it.t]}</div></div>
    <div class="li-ans num">${it.ans}</div></div>`;
}

/* ---------- 重來 ---------- */
let restartArm = null;
function disarmRestart() { clearTimeout(restartArm); restartArm = null; $("#restartBtn").classList.remove("armed"); $("#restartTxt").textContent = "重來"; }
$("#restartBtn").addEventListener("click", () => {
  if (!restartArm) { $("#restartBtn").classList.add("armed"); $("#restartTxt").textContent = "確定？"; restartArm = setTimeout(disarmRestart, 3000); return; }
  disarmRestart(); startRound();
});

/* ---------- 練習範圍面板 ---------- */
let draft = null, skipArm = false;
function lvStatus(lv) {
  if (!isUnlocked(lv)) return `<span class="st">🔒 未解鎖</span>`;
  if (lv === "all") return `<span class="st">日常維持</span>`;
  const L = lvProg[lv];
  if (L.passed) return `<span class="st ok">✓ 已過關</span>`;
  return `<span class="st">連續 ${Math.min(L.streak, PASS_STREAK)}／${PASS_STREAK}</span>`;
}
function renderSheet() {
  const cnt = (lv) => poolOf(lv, draft.ca).length;
  const lvBtn = (lv, name, desc) => `<button class="lv" data-lv="${lv}" aria-pressed="${draft.lv === lv}" ${isUnlocked(lv) ? "" : "disabled"}>
      <div class="lv-main"><b>${name}</b><small>${desc}</small></div>${lvStatus(lv)}</button>`;
  const allUnlocked = isUnlocked("all");
  $("#sheet").innerHTML = `
    <h3>練習範圍</h3>
    <p class="sec-title">層級</p>
    ${LEVELS.map((L) => lvBtn(L.id, LEVEL_NAME[L.id], `${L.desc}・${cnt(L.id)} 格${L.id > 1 ? "・每輪含 6 題複習" : ""}`)).join("")}
    ${lvBtn("all", "三層混合", "核心 10 題＋進階 6 題＋高資費 4 題")}
    <p class="sec-title" style="margin-top:14px">電信</p>
    <div class="seg" id="caSeg">${["all", ...DATA.carriers.map((c) => c.id)].map((id) => `<button data-ca="${id}" aria-pressed="${draft.ca === id}">${CA_SHORT[id] || id}</button>`).join("")}</div>
    <p class="hint" style="text-align:left">過關條件：選「三家」並全程用「輸入數字」，連續兩輪答對 ${PASS_SCORE} 題以上（90%），就會解鎖下一層。單一電信適合剛開始一家一家背，不計入過關。</p>
    <button class="btn" id="applyScope" style="margin-top:14px">開始練習</button>
    <button class="btn ghost" id="closeSheet" style="margin-top:10px">取消</button>
    ${allUnlocked ? "" : `<button class="linkbtn" id="skipLock">${skipArm ? "再按一次確認：直接解鎖全部層級" : "略過門檻，直接解鎖全部層級"}</button>`}`;
}
function openSheet() { draft = { ...scope }; skipArm = false; renderSheet(); $("#sheetBg").classList.remove("hidden"); clearTimeout(autoTimer); }
function closeSheet() { $("#sheetBg").classList.add("hidden"); }
$("#scopeBtn").addEventListener("click", openSheet);
$("#sheetBg").addEventListener("click", (e) => {
  if (e.target.id === "sheetBg" || e.target.id === "closeSheet") return closeSheet();
  const lvb = e.target.closest("[data-lv]");
  if (lvb && !lvb.disabled) { const v = lvb.dataset.lv; draft.lv = v === "all" ? "all" : Number(v); return renderSheet(); }
  const cab = e.target.closest("[data-ca]");
  if (cab) { draft.ca = cab.dataset.ca; return renderSheet(); }
  if (e.target.id === "applyScope") { scope = { ...draft }; LS.set("cq_scope", scope); closeSheet(); return startRound(); }
  if (e.target.id === "skipLock") {
    if (!skipArm) { skipArm = true; renderSheet(); setTimeout(() => { skipArm = false; if (!$("#sheetBg").classList.contains("hidden")) renderSheet(); }, 3000); return; }
    lvProg.skip = true; LS.set("cq_lv", lvProg); skipArm = false; renderSheet();
  }
});

/* ---------- 過往紀錄與層級進度 ---------- */
let returnTo = "#quiz";
$("#histBtn").addEventListener("click", () => { clearTimeout(autoTimer); renderHistory("#quiz"); });
function renderHistory(from) {
  returnTo = from;
  const rounds = hist.length;
  const totC = hist.reduce((a, h) => a + h.c, 0), totN = hist.reduce((a, h) => a + h.n, 0);
  const best = rounds ? Math.max(...hist.map((h) => Math.round((h.c / h.n) * 100))) : null;
  const avg = totN ? Math.round((totC / totN) * 100) : null;
  const lvCards = LEVELS.map((L) => {
    const pool = ITEMS.filter((it) => it.lv === L.id);
    const tried = pool.filter((it) => itemStat[it.key]).length;
    const mastered = pool.filter((it) => itemStat[it.key] && itemStat[it.key][2]).length;
    const p = pool.length ? Math.round((mastered / pool.length) * 100) : 0;
    return `<div class="lv-row"><div class="row-between"><b>${LEVEL_NAME[L.id]}</b>${lvStatus(L.id)}</div>
      <div class="li-sub">最近一次答對 ${mastered}／${pool.length} 格・已練過 ${tried} 格</div>
      <div class="bar"><i style="width:${p}%;background:var(--accent)"></i></div></div>`;
  }).join("");
  const modeTag = (m) => (m === "i" ? `<span class="mode-mini">輸入</span>` : m === "x" ? `<span class="mode-mini">混合</span>` : "");
  const rows = hist.slice().reverse().map((h) => {
    const p = Math.round((h.c / h.n) * 100), cls = p >= 80 ? "hi" : p >= 60 ? "mid" : "lo";
    const ws = h.w.map((k) => BYKEY[k]).filter(Boolean);
    const sc = h.lv ? `<span class="scope-mini">${esc(scopeLabel({ lv: h.lv, ca: h.ca || "all" }))}</span>` : "";
    return `<details class="hist-item"><summary><span class="when num">${fmtTime(h.at)} ${sc} ${modeTag(h.m)}</span><span class="sc num">${h.c}/${h.n}</span><span class="pct ${cls} num">${p}%</span></summary>
      ${ws.length ? ws.map(itemRow).join("") : `<div class="li-sub">全部答對</div>`}</details>`;
  }).join("");
  const trapN = ITEMS.filter((it) => it.trap.length).length;
  $("#historyBody").innerHTML = `
    <button class="back" id="hBack">‹ ${from === "#quiz" ? "繼續作答" : "返回"}</button>
    <div class="top"><div class="brand">過往紀錄<small>點任一輪可看當輪答錯的題目</small></div></div>
    <div class="card"><p class="sec-title">層級進度</p>${lvCards}</div>
    <div class="card"><div class="big-stat num">
      <div><b>${rounds}</b><span>完成輪數</span></div>
      <div><b>${avg == null ? "—" : avg + "%"}</b><span>平均正確率</span></div>
      <div><b>${best == null ? "—" : best + "%"}</b><span>最佳成績</span></div>
    </div></div>
    <div class="card">${rows || `<div class="empty"><b>📝</b>還沒有紀錄<br>完成一輪 20 題後會出現在這裡</div>`}</div>
    <p class="hint">成績以每輪 20 題的首次作答計算，重考不計分。<br>題庫共 ${ITEMS.length} 格，其中陷阱格 ${trapN} 格。<br>佣金資料：${esc(DATA.updated || "—")}<br>紀錄保存在這台裝置的瀏覽器中。</p>
    <button class="btn" id="hRestart" style="margin-top:14px">重新開始一輪</button>
    <button class="btn danger" id="hLock" style="margin-top:10px">鎖定（下次需重新輸入密碼）</button>`;
  show("#history");
  $("#hBack").onclick = () => {
    show(returnTo);
    if (returnTo === "#quiz" && session && session.answered) $("#nextDock").classList.remove("hidden");
  };
  $("#hRestart").onclick = () => startRound();
  $("#hLock").onclick = () => { LS.del("cq_pw"); location.reload(); };
}

boot();
})();
</script>
</body>
</html>
