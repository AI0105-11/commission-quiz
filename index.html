<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6d5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="佣金速記">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>佣金速記</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#efece5; --ink:#1b1d22; --muted:#6c6f77;
  --line:#e3dfd6; --accent:#2f6d5a; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --good:#1d8a57; --good-soft:#dff3e8; --bad:#cf3a3a; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 14px rgba(20,20,20,.05);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1b1e22; --surface2:#24282d; --ink:#eceae5; --muted:#9a9ea6;
    --line:#2e3238; --accent:#5fb394; --accent-ink:#0d1a15; --accent-soft:#1d3a30;
    --good:#4cc488; --good-soft:#163527; --bad:#ff6b63; --bad-soft:#3d1c1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e22; --surface2:#24282d; --ink:#eceae5; --muted:#9a9ea6;
  --line:#2e3238; --accent:#5fb394; --accent-ink:#0d1a15; --accent-soft:#1d3a30;
  --good:#4cc488; --good-soft:#163527; --bad:#ff6b63; --bad-soft:#3d1c1b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;min-height:100dvh;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-weight:800;font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:#fff1cc;color:#7a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{background:#3a3110;color:#f3d77a}}

/* cards / sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:600;font-size:15px;transition:all .12s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.c-cht[aria-pressed="true"]{background:#1f5fbf;border-color:#1f5fbf;color:#fff}
.chip.c-twm[aria-pressed="true"]{background:#e8710a;border-color:#e8710a;color:#fff}
.chip.c-fet[aria-pressed="true"]{background:#d11f3a;border-color:#d11f3a;color:#fff}
.chip.sm{min-height:34px;padding:5px 11px;font-size:14px;border-radius:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
details.plans summary{list-style:none;cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;padding:4px 0}
details.plans summary::-webkit-details-marker{display:none}
.plan-group{margin-top:10px}
.plan-group h4{margin:0 0 6px;font-size:13px;color:var(--muted)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  border-radius:14px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);
}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:15px;width:auto;padding:0 16px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.15s;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}

/* bottom nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.qbar .x{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.prog{flex:1;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .25s}
.qcount{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:20px 18px 18px;position:relative;overflow:hidden;margin-bottom:14px;
}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc,var(--accent))}
.carrier{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:var(--cc)}
.carrier::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.qplan{font-size:32px;font-weight:800;line-height:1.2;margin:6px 0 12px;letter-spacing:.5px}
.qtags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:17px;font-weight:700;padding:6px 14px;border-radius:10px;background:var(--surface2)}
.tag.t0{background:#e3edff;color:#1d4fa3}
.tag.t1{background:#e4f5ea;color:#1c7a47}
.tag.t2{background:#f6ebff;color:#7a3aa8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag.t0{background:#1c2a44;color:#9cc0ff}
  :root:not([data-theme="light"]) .tag.t1{background:#17352a;color:#8fdcb0}
  :root:not([data-theme="light"]) .tag.t2{background:#33213f;color:#d6a8f5}
}
.qask{margin-top:14px;font-size:15px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  min-height:68px;border-radius:16px;background:var(--surface);border:2px solid var(--line);
  font-size:24px;font-weight:800;box-shadow:var(--shadow);transition:transform .08s,background .12s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.opt small{font-size:13px;font-weight:600;color:var(--muted)}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:16px 2px 10px}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.next-dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:15}
.next-dock .btn{max-width:488px;margin:0 auto}

/* tables */
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.rt th,.rt td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.rt th{font-size:12px;color:var(--muted);font-weight:700}
.rt td:first-child,.rt th:first-child{text-align:left;color:var(--muted);font-weight:600;font-size:14px}
.rt tr:last-child td{border-bottom:0}
.rt td.v{font-weight:700}
.rt td.hl{background:var(--accent-soft);color:var(--accent);border-radius:8px;outline:2px solid var(--accent);outline-offset:-2px}
.rt td.na{color:var(--muted);font-weight:400}
.rt td.cover{cursor:pointer}
.rt td.cover span{display:inline-block;min-width:52px;border-radius:6px;background:var(--surface2);color:transparent;user-select:none}
.plan-card h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}

/* lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-title{font-weight:700}
.li-sub{font-size:13px;color:var(--muted)}
.li-ans{font-weight:800;font-size:18px}
.badge-n{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}

.big-stat{display:flex;gap:10px}
.big-stat div{flex:1;background:var(--surface2);border-radius:14px;padding:12px;text-align:center}
.big-stat b{display:block;font-size:26px}
.big-stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:10px}
.stat-row{padding:10px 0}

/* lock */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:420px;margin:0 auto}
.lock .logo{width:72px;height:72px;border-radius:20px;background:var(--accent);display:grid;place-items:center;margin-bottom:18px}
.lock h1{margin:0 0 4px;font-size:26px}
.lock p{margin:0 0 22px;color:var(--muted)}
.field{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;padding:0 16px;margin-bottom:12px;outline:none}
.field:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:-4px 0 8px}
.summary-score{text-align:center;padding:10px 0 4px}
.summary-score b{font-size:56px;line-height:1}
.summary-score div{color:var(--muted)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
.qbar .x{color:var(--muted)}
.hist-item{border-bottom:1px solid var(--line);padding:12px 0}
.hist-item:last-child{border-bottom:0}
.hist-item summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item .when{flex:1;font-size:14px;color:var(--muted)}
.hist-item .sc{font-weight:800;font-size:18px}
.hist-item .pct{min-width:52px;text-align:right;font-weight:700;font-size:14px;padding:2px 8px;border-radius:99px}
.pct.hi{background:var(--good-soft);color:var(--good)}
.pct.mid{background:#fff1cc;color:#7a5a00}
.pct.lo{background:var(--bad-soft);color:var(--bad)}
.hist-item .li-sub{margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);min-height:40px}
.restart{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface2);font-size:14px;font-weight:700;color:var(--muted);flex:none;white-space:nowrap}
.restart.armed{background:var(--bad-soft);color:var(--bad)}
.big-stat span{white-space:nowrap}
@media (max-width:360px){.big-stat{gap:6px}.big-stat div{padding:10px 4px}.big-stat b{font-size:22px}.qcount{font-size:13px}}
.mode-seg{margin:-4px 0 12px}
.mode-seg button{min-height:32px;font-size:13px}
.tag.retry{font-size:12px;padding:3px 10px;background:#fff1cc;color:#7a5a00}
.trap{background:#fff4e0;border:1px solid #f0c98a;color:#7a4b00;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.trap b{display:block;margin-bottom:2px}
.rt td.tp{position:relative}
.rt td.tp::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#e08a00}
.ans-form{display:flex;gap:10px}
.ans-in{flex:1;margin:0;font-size:26px;font-weight:800;text-align:center;min-height:64px}
.ans-form .btn{width:96px;min-height:64px}
.ans-in.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ans-in.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.trap-mini,.mode-mini{font-size:11px;padding:1px 6px;border-radius:6px;background:#fff1cc;color:#7a5a00;font-weight:700;vertical-align:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trap{background:#33270f;border-color:#6b5020;color:#f3cf86}
 :root:not([data-theme="light"]) .tag.retry,:root:not([data-theme="light"]) .trap-mini,:root:not([data-theme="light"]) .mode-mini{background:#3a3110;color:#f3d77a}}
.qtop{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.scope{flex:1;min-width:0;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.scope span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar2{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:20px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:8px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .lv-main{flex:1;min-width:0}
.lv b{display:block;font-size:16px}
.lv small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.lv .st{font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.lv .st.ok{color:var(--good)}
.linkbtn{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;min-height:36px}
.pass-banner{background:var(--good-soft);color:var(--good);border-radius:14px;padding:14px;font-weight:700;margin-bottom:14px}
.pass-banner small{display:block;font-weight:500;margin-top:4px;color:var(--ink)}
.prog-note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.lv-row{padding:10px 0;border-bottom:1px solid var(--line)}
.lv-row:last-child{border-bottom:0}
.hist-item .when{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.mode-mini,.trap-mini{white-space:nowrap}
.common{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.6}
.common .ct{display:block;font-weight:800;color:var(--accent);margin-bottom:2px}
.common ul{margin:0;padding-left:18px}
.common li{margin:2px 0}
.common b{color:var(--accent)}
.calc-row{margin-bottom:12px}
.calc-grid{display:grid;gap:8px}
.calc-grid.g2{grid-template-columns:repeat(2,1fr)}.calc-grid.g3{grid-template-columns:repeat(3,1fr)}.calc-grid.g4{grid-template-columns:repeat(4,1fr)}
.cbtn{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;text-align:center;word-break:break-word}
.cbtn small{font-size:12px;font-weight:600;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.cbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbtn[aria-pressed="true"] small{color:inherit;opacity:.85}
.cbtn.c-twm[aria-pressed="true"]{background:#e8710a;border-color:#e8710a;color:#fff}
.cbtn.c-cht[aria-pressed="true"]{background:#1f5fbf;border-color:#1f5fbf;color:#fff}
.cbtn.c-fet[aria-pressed="true"]{background:#d11f3a;border-color:#d11f3a;color:#fff}
.cbtn:disabled{opacity:.35;cursor:not-allowed}
.cbtn.dim{opacity:.55;border-style:dashed}
.res-card{border-top:6px solid var(--accent)}
.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.res-head b{font-size:20px}
.res-head .tag{font-size:13px;padding:3px 10px}
.res-base{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.res-base b{font-size:40px;font-weight:800}
.res-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.res-line b{text-align:right}
.res-line .cnote{display:block;font-size:12px;font-weight:600;color:var(--bad)}
.res-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-size:18px;font-weight:800}
.res-total b{font-size:32px;color:var(--accent)}
.res-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 8px}
.res-two div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.res-two span{display:block;font-size:13px;color:var(--muted)}
.res-two b{font-size:30px}
.res-status{font-size:22px;font-weight:800;color:var(--bad);padding:6px 0}
b.pos{color:var(--good)} b.neg{color:var(--bad)}
.tg{padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.tg span{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.tg small{flex-basis:100%;font-size:12px;color:var(--muted)}
.tg-ren{padding:8px 0;border-bottom:1px dashed var(--line)}
.tg-ren>span{display:block;margin-bottom:6px}
.tg-ren .seg button{font-size:13px;min-height:36px}
.warn-txt{display:block;margin-top:6px;font-size:12px;color:#a35a00}
.notes ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.cmp{font-size:16px}
.cmp b{color:var(--accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.app-seg{margin-bottom:10px}
.app-seg button{min-height:36px}
.pform{padding:6px 14px 14px}
.pf-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.pf-row label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pf-num{display:flex;align-items:center;gap:8px}
.pf-num input{margin:0;min-height:48px;font-size:22px;font-weight:800;text-align:center;flex:1;min-width:0}
.pf-num span{color:var(--muted);font-size:14px;white-space:nowrap}
.pf-num input.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pf-num input.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.pf-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pchip{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;padding:6px 8px;text-align:left;line-height:1.35}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pchip.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pchip.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.pchip:disabled{cursor:default}
.pf-info{font-weight:700;color:var(--muted)}
.pf-res{margin-top:6px;font-size:14px;font-weight:700}
.pf-res:empty{display:none}
.okt{color:var(--good)}.ngt{color:var(--bad)}
.pcmp{width:100%;font-size:13px;border-collapse:collapse;margin:6px 0}
.pcmp th,.pcmp td{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.pcmp th{font-size:12px;color:var(--muted)}
.pcmp tr.me td{font-weight:800;color:var(--accent)}
.pcmp small{display:block;font-size:11px;color:var(--muted)}
.pcmp .dcell{font-size:12px}
.pcmp td:not(.dcell),.pcmp th{white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.lg{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface2)}
.vg{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-size:13px}
.vg th{font-size:12px;padding:5px 2px;color:#fff;border-radius:6px;font-weight:700}
.vg th.rh,.vg td.rh{background:none;border:0;color:var(--muted);font-weight:700;width:62px;text-align:left;font-size:12px;padding:2px}
.vg th.ph{background:var(--surface2);color:var(--muted)}
.vg td.rh small{display:block;font-weight:500;font-size:11px}
.vg td{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;line-height:1.35;vertical-align:middle;font-variant-numeric:tabular-nums;word-break:break-word}
.vg td small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.vg td .big{font-size:18px}
.vg td.eq3,.lg.eq3{background:var(--surface2);border-color:transparent;color:var(--muted)}
.vg td.eq2,.lg.eq2{background:#e6f4ec;border-color:#bfe3cd}
.vg td.hl,.lg.hl{background:#fff1cc;border-color:#f0d27a;font-weight:800}
.vg td.na,.lg.na{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,transparent 4px,transparent 8px);border-color:transparent;color:var(--muted)}
.vg td.mecol{outline:2.5px solid var(--accent);outline-offset:-2px}
.vg .bdg{display:block;font-size:10px;font-weight:800;color:#a35a00}

.sec-title .sub{font-weight:500}
.pchip2{display:inline-block;min-width:24px;margin:1px;padding:1px 3px;border-radius:5px;font-size:11px;color:var(--muted);text-decoration:line-through;opacity:.5}
.pchip2.on{background:var(--accent);color:var(--accent-ink);text-decoration:none;opacity:1;font-weight:700}
.jump div{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.jump b{background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:8px}
.jump small{flex-basis:100%;color:var(--muted)}
.cmg td.cm{padding:4px 2px;background:color-mix(in srgb,var(--accent) calc(var(--heat) * 0.35%),var(--surface))}

<script src="data.enc.js"></script>
<script>
(() => {
"use strict";
const TYPES = ["攜碼", "新辦", "續約"];
const PERIODS = ["24", "30", "36", "48"];
const ROUND = 20;
const AUTO_NEXT_MS = 3500;   // 答對後自動跳題（有時間看共通點；碰觸或捲動畫面就停止）
const RETRY_MAX = 2;        // 同一題在同一輪最多重考次數
const TRAP_P = 0.5;         // 同格位有陷阱格時，優先抽陷阱格的機率
const PASS_SCORE = 18;      // 過關門檻：20 題首答對 18 題（90%）
const PASS_STREAK = 2;      // 需連續幾輪

const LEVELS = [
  { id: 1, name: "核心", desc: "5G-599／799／999・24、30 期" },
  { id: 2, name: "進階", desc: "5G-1099～1399 全部期數，及 599～999 的 36、48 期" },
  { id: 3, name: "高資費", desc: "5G-1499 以上" }
];
const LEVEL_NAME = { 1: "核心層", 2: "進階層", 3: "高資費層", all: "三層混合" };
// 每輪組成：[層級, 題數]
const MIX = { 1: [[1, 20]], 2: [[2, 14], [1, 6]], 3: [[3, 14], [1, 3], [2, 3]], all: [[1, 10], [2, 6], [3, 4]] };
const CA_SHORT = { all: "三家", twm: "台哥大", cht: "中華", fet: "遠傳" };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => (a && a.length ? a[Math.floor(Math.random() * a.length)] : null);
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (t) => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const sgn = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
const priceOf = (name) => { const m = String(name).match(/(\d{3,5})(?!.*\d{3,5})/); return m ? Number(m[1]) : 0; };

let DATA = null, ITEMS = [], BYKEY = {};
let hist = LS.get("cq_hist", []);                 // 每輪：{at, c, n, w, m, r, lv, ca}
let itemStat = LS.get("cq_item", {});             // 每格首答紀錄：key → [作答次數, 答對次數, 最近一次是否答對]
let lvProg = LS.get("cq_lv", null);               // 各層過關進度
let scope = LS.get("cq_scope", { lv: 1, ca: "all" });
let mode = LS.get("cq_mode", "choice");
let session = null;
const defaultProg = () => ({ 1: { passed: false, streak: 0 }, 2: { passed: false, streak: 0 }, 3: { passed: false, streak: 0 }, skip: false });
if (!lvProg) lvProg = defaultProg();

/* ---------- 解密 ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const E = window.ENC_DATA, enc = new TextEncoder();
  const bk = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(E.salt), iterations: E.iter || 200000, hash: "SHA-256" },
    bk, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function boot() {
  if (!window.ENC_DATA) return showLockError("找不到資料檔 data.enc.js");
  if (!window.crypto || !crypto.subtle) return showLockError("此網址不支援加密功能，請用 https 網址開啟");
  const saved = LS.get("cq_pw", null);
  if (saved) { try { DATA = await decrypt(saved); return start(); } catch (e) { LS.del("cq_pw"); } }
  $("#lock").classList.remove("hidden");
  setTimeout(() => $("#pw").focus(), 50);
}
function showLockError(msg) { $("#lock").classList.remove("hidden"); $("#pwErr").textContent = msg; }
$("#lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  $("#unlockBtn").disabled = true; $("#unlockBtn").textContent = "解鎖中…";
  try {
    DATA = await decrypt(pw);
    if ($("#remember").checked) LS.set("cq_pw", pw);
    $("#lock").classList.add("hidden");
    start();
  } catch (err) {
    $("#pwErr").textContent = "密碼錯誤";
    $("#lockForm").classList.remove("shake"); void $("#lockForm").offsetWidth; $("#lockForm").classList.add("shake");
  }
  $("#unlockBtn").disabled = false; $("#unlockBtn").textContent = "解鎖";
});

/* ---------- 資料整理 ---------- */
const keyOf = (c, p, per, t) => `${c.id}|${p.name}|${per}|${t}`;
function levelOf(it) {
  const pr = priceOf(it.p.name);
  if ([599, 799, 999].includes(pr) && (it.per === "24" || it.per === "30")) return 1;
  return pr <= 1399 ? 2 : 3;
}
function buildItems() {
  ITEMS = []; BYKEY = {};
  for (const c of DATA.carriers) for (const p of c.plans) for (const per of PERIODS) {
    const r = p.rates[per]; if (!r) continue;
    r.forEach((v, t) => {
      if (v === null || v === undefined || v === "") return;
      const it = { key: keyOf(c, p, per, t), c, p, per, t, ans: Number(v), trap: [] };
      it.lv = levelOf(it);
      ITEMS.push(it); BYKEY[it.key] = it;
    });
  }
  detectTraps();
}

/* ---------- 陷阱格偵測 ----------
   先統計資料的多數規律，再把例外或數字相同（容易搞混）的格子標成陷阱格：
   1. 同期數內三種類型的大小順序　2. 期數越長佣金的增減方向　3. 同電信同格位，資費越高佣金的增減方向 */
function detectTraps() {
  const flag = (c, p, per, t, msg) => { const it = BYKEY[keyOf(c, p, per, t)]; if (it && !it.trap.includes(msg)) it.trap.push(msg); };
  const pairs = [[0, 1], [1, 2], [0, 2]];
  // 至少 80% 的資料都符合，才當成規律（否則不算陷阱，例如新辦和續約的高低各半）
  const ruleDir = (s, n) => (n && Math.abs(s) >= 0.6 * n ? sgn(s) : 0);
  const tdir = {};
  for (const [a, b] of pairs) {
    let s = 0, n = 0;
    for (const c of DATA.carriers) for (const p of c.plans) for (const per of PERIODS) {
      const r = p.rates[per]; if (r && r[a] != null && r[b] != null && r[a] !== r[b]) { s += sgn(r[a] - r[b]); n++; }
    }
    tdir[a + "" + b] = ruleDir(s, n);
  }
  const periodPairs = (p, t) => {
    const out = []; let prev = null;
    for (const per of PERIODS) { const r = p.rates[per]; if (!r || r[t] == null) continue; if (prev) out.push([prev, per]); prev = per; }
    return out;
  };
  let ps = 0, pn = 0;
  for (const c of DATA.carriers) for (const p of c.plans) for (let t = 0; t < 3; t++)
    for (const [p1, p2] of periodPairs(p, t)) { const d = sgn(p.rates[p2][t] - p.rates[p1][t]); if (d) { ps += d; pn++; } }
  const pdir = ruleDir(ps, pn);
  const sortedPlans = (c) => c.plans.filter((p) => priceOf(p.name)).sort((x, y) => priceOf(x.name) - priceOf(y.name));
  let fs = 0, fn = 0;
  for (const c of DATA.carriers) { const sp = sortedPlans(c);
    for (let i = 1; i < sp.length; i++) for (const per of PERIODS) for (let t = 0; t < 3; t++) {
      const a = sp[i - 1].rates[per], b = sp[i].rates[per];
      if (a && b && a[t] != null && b[t] != null && a[t] !== b[t]) { fs += sgn(b[t] - a[t]); fn++; }
    } }
  const fdir = ruleDir(fs, fn);
  for (const c of DATA.carriers) {
    for (const p of c.plans) for (const per of PERIODS) {
      const r = p.rates[per]; if (!r) continue;
      for (const [a, b] of pairs) {
        const x = r[a], y = r[b], d = tdir[a + "" + b];
        if (x == null || y == null) continue;
        if (x === y) { const m = `${per} 期的${TYPES[a]}和${TYPES[b]}一樣都是 ${x}`; flag(c, p, per, a, m); flag(c, p, per, b, m); }
        else if (d && sgn(x - y) === -d) {
          const [hi, lo, vh, vl] = x > y ? [a, b, x, y] : [b, a, y, x];
          const m = `${per} 期的${TYPES[hi]} ${vh} 反而比${TYPES[lo]} ${vl} 高`;
          flag(c, p, per, a, m); flag(c, p, per, b, m);
        }
      }
    }
    for (const p of c.plans) for (let t = 0; t < 3; t++) for (const [p1, p2] of periodPairs(p, t)) {
      const v1 = p.rates[p1][t], v2 = p.rates[p2][t];
      if (v1 === v2) { const m = `${TYPES[t]}的 ${p1} 期和 ${p2} 期一樣都是 ${v1}`; flag(c, p, p1, t, m); flag(c, p, p2, t, m); }
      else if (pdir && sgn(v2 - v1) === -pdir) { const m = `${TYPES[t]}的 ${p2} 期 ${v2} 反而比 ${p1} 期 ${v1} ${v2 < v1 ? "低" : "高"}`; flag(c, p, p1, t, m); flag(c, p, p2, t, m); }
    }
    const sp = sortedPlans(c);
    if (fdir) for (let i = 1; i < sp.length; i++) for (const per of PERIODS) for (let t = 0; t < 3; t++) {
      const lo = sp[i - 1], hi = sp[i], a = lo.rates[per], b = hi.rates[per];
      if (!a || !b || a[t] == null || b[t] == null) continue;
      if (a[t] === b[t]) {
        flag(c, lo, per, t, `和更高資費的 ${hi.name} 一樣都是 ${a[t]}`);
        flag(c, hi, per, t, `和較低資費的 ${lo.name} 一樣都是 ${b[t]}`);
      } else if (sgn(b[t] - a[t]) === -fdir) {
        flag(c, lo, per, t, `比更高資費的 ${hi.name}（${b[t]}）還${a[t] > b[t] ? "高" : "低"}`);
        flag(c, hi, per, t, `比較低資費的 ${lo.name}（${a[t]}）還${b[t] < a[t] ? "低" : "高"}`);
      }
    }
  }
}

function start() {
  // 第一次載入正式資料時，清掉測試資料留下的紀錄
  const prevId = LS.get("cq_dataid", null);
  if (prevId !== DATA.id) {
    if (!prevId) { hist = []; itemStat = {}; lvProg = defaultProg(); LS.set("cq_hist", hist); LS.set("cq_item", itemStat); LS.set("cq_lv", lvProg); }
    LS.set("cq_dataid", DATA.id || "");
  }
  // 三家順序統一：中華｜台哥大｜遠傳
  const ORD = ["cht", "twm", "fet"];
  DATA.carriers.sort((a, b) => ORD.indexOf(a.id) - ORD.indexOf(b.id));
  if (DATA.calc) DATA.calc.carriers.sort((a, b) => ORD.indexOf(a.id) - ORD.indexOf(b.id));
  buildItems();
  if (scope.lv === "plan" && !sharedPlans().includes(scope.plan)) scope = { lv: 1, ca: "all" };
  if (!isUnlocked(scope.lv)) scope = { lv: 1, ca: scope.ca || "all" };
  if (scope.ca !== "all" && !DATA.carriers.some((c) => c.id === scope.ca)) scope.ca = "all";
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  buildPItems();
  startRound();
  if (appMode === "plan" && PITEMS.length) startPRound();
  else if (appMode === "notes") { renderNotes(); show("#notes"); }
  else appMode = "comm";
}

/* ---------- 層級與範圍 ---------- */
function isUnlocked(lv) {
  if (lv === "plan") return true;   // 依資費練習隨時可用
  if (lvProg.skip) return true;
  if (lv === 1) return true;
  if (lv === 2) return lvProg[1].passed;
  if (lv === 3) return lvProg[2].passed;
  return lvProg[1].passed && lvProg[2].passed && lvProg[3].passed;   // 三層混合
}
const poolOf = (lv, ca) => ITEMS.filter((it) => it.lv === lv && (ca === "all" || it.c.id === ca));
const scopeLabel = (s) => (s.lv === "plan" ? `${s.plan}・三家同資費` : `${LEVEL_NAME[s.lv]}・${CA_SHORT[s.ca]}`);
// 三家都有的資費（依資費練習用）
function sharedPlans() {
  const m = new Map();
  for (const it of ITEMS) { if (!m.has(it.p.name)) m.set(it.p.name, new Set()); m.get(it.p.name).add(it.c.id); }
  return [...m.entries()].filter(([, s]) => s.size === DATA.carriers.length).map(([n]) => n).sort((a, b) => priceOf(a) - priceOf(b));
}
// 依資費練習：讓相鄰兩題盡量不同期數、不同電信
function interleave(items) {
  let rest = shuffle(items); const out = [];
  while (rest.length) {
    const prev = out[out.length - 1];
    let i = prev ? rest.findIndex((x) => x.per !== prev.per && x.c !== prev.c) : 0;
    if (i < 0) i = rest.findIndex((x) => x.per !== prev.per);
    if (i < 0) i = rest.findIndex((x) => x.key !== prev.key);
    if (i < 0) i = 0;
    out.push(rest.splice(i, 1)[0]);
  }
  return out;
}

/* ---------- 平均抽題 ----------
   在指定題庫內，讓電信、期數、類型的題數盡量平均，同電信的方案輪流出現；
   同格位有陷阱格時有一半機率優先抽陷阱格。不參考過往紀錄。 */
function spread(list, n) { let out = []; while (out.length < n) out = out.concat(shuffle(list)); return shuffle(out.slice(0, n)); }
function buildFrom(pool, n) {
  if (!pool.length || n <= 0) return [];
  const cars = [...new Set(pool.map((x) => x.c))], pers = [...new Set(pool.map((x) => x.per))], typs = [...new Set(pool.map((x) => x.t))];
  const cs = spread(cars, n), ps = spread(pers, n), ts = spread(typs, n);
  const planQ = new Map(), used = new Set(), out = [];
  const free = (x) => !used.has(x.key);
  for (let i = 0; i < n; i++) {
    const c = cs[i], per = ps[i], t = ts[i];
    let it = null;
    const cands = pool.filter((x) => x.c === c && x.per === per && x.t === t && free(x));
    if (cands.length) {
      const traps = cands.filter((x) => x.trap.length);
      if (traps.length && Math.random() < TRAP_P) it = pick(traps);
      else {
        let q = planQ.get(c);
        if (!q || !q.length) { q = shuffle([...new Set(pool.filter((x) => x.c === c).map((x) => x.p))]); planQ.set(c, q); }
        for (let j = 0; j < q.length && !it; j++) { const f = cands.find((x) => x.p === q[j]); if (f) { it = f; q.splice(j, 1); } }
        if (!it) it = pick(cands);
      }
    }
    if (!it) it = pick(pool.filter((x) => x.c === c && x.t === t && free(x)));
    if (!it) it = pick(pool.filter((x) => x.c === c && free(x)));
    if (!it) it = pick(pool.filter(free));
    if (!it) { used.clear(); it = pick(pool.filter((x) => !out.length || x.key !== out[out.length - 1].key)) || pick(pool); }
    used.add(it.key); out.push(it);
  }
  return out;
}
function buildRound(sc) {
  if (sc.lv === "plan") {
    const pool = ITEMS.filter((it) => it.p.name === sc.plan);
    return interleave(buildFrom(pool, ROUND)).map((it) => ({ it, review: false }));
  }
  let list = [];
  for (const [lv, n] of MIX[sc.lv]) {
    const pool = poolOf(lv, sc.ca);
    list = list.concat(buildFrom(pool, n).map((it) => ({ it, review: lv !== sc.lv && sc.lv !== "all" })));
  }
  // 題數不足 20 時（例如某層題庫是空的），從本範圍其他題補足
  if (list.length < ROUND) {
    const all = ITEMS.filter((it) => sc.ca === "all" || it.c.id === sc.ca);
    list = list.concat(buildFrom(all, ROUND - list.length).map((it) => ({ it, review: false })));
  }
  list = shuffle(list);
  for (let i = 1; i < list.length; i++) if (list[i].it.key === list[i - 1].it.key) { const j = (i + 2) % list.length; [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}

function makeOptions(it) {
  const ans = it.ans, seen = new Set([ans]), pick3 = [];
  const add = (v) => { v = Number(v); if (!(v > 0) || seen.has(v)) return; seen.add(v); pick3.push(v); };
  const samePlan = [];
  for (const per of PERIODS) { const r = it.p.rates[per]; if (r) r.forEach((v) => { if (v != null) samePlan.push(Number(v)); }); }
  for (const v of shuffle(samePlan)) { if (pick3.length >= 2) break; add(v); }
  // 其他電信同方案同格位（最容易混淆）＋同電信其他方案同格位
  const sameSlot = [];
  for (const c of DATA.carriers) for (const p of c.plans) {
    if (p === it.p) continue;
    if (c !== it.c && p.name !== it.p.name) continue;
    const r = p.rates[it.per]; if (r && r[it.t] != null) sameSlot.push(Number(r[it.t]));
  }
  for (const v of shuffle(sameSlot)) { if (pick3.length >= 3) break; add(v); }
  const step = ans >= 5000 ? 500 : ans >= 1000 ? 100 : 50;
  for (const k of shuffle([1, -1, 2, -2, 3, -3, 4, -4, 5])) { if (pick3.length >= 3) break; add(ans + k * step); }
  return shuffle([ans, ...pick3.slice(0, 3)]);
}

/* ---------- 作答 ---------- */
function show(id) { ["#quiz", "#summary", "#history", "#calc", "#pquiz", "#psummary", "#phist", "#notes"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); $("#nextDock").classList.add("hidden"); $("#pNextDock").classList.add("hidden"); window.scrollTo(0, 0); }

function startRound() {
  if (restartArm) disarmRestart();
  clearTimeout(autoTimer);
  // orig：本輪 20 題；pending：待重考 {it, due}；step：已作答題數
  session = { scope: { ...scope }, orig: buildRound(scope), oi: 0, pending: [], step: 0, q: null, firstOk: 0, firstWrong: [], retryAsk: 0, retryOk: 0, retryCount: {}, cur: null, answered: false, modes: new Set() };
  $("#scopeTxt").textContent = scopeLabel(scope);
  show("#quiz");
  renderQuestion();
}
function nextQ() {
  const s = session;
  const due = s.pending.filter((x) => x.due <= s.step).sort((x, y) => x.due - y.due)[0];
  if (due) { s.pending.splice(s.pending.indexOf(due), 1); return { it: due.it, retry: true }; }
  if (s.oi < s.orig.length) { const o = s.orig[s.oi++]; return { it: o.it, retry: false, review: o.review }; }
  if (s.pending.length) { s.pending.sort((x, y) => x.due - y.due); return { it: s.pending.shift().it, retry: true }; }
  return null;
}
const progress = (extra) => { const s = session, left = (s.orig.length - s.oi) + s.pending.length + 1; return ((s.step + extra) / (s.step + left)) * 100; };
const roundDone = () => session.oi >= session.orig.length && !session.pending.length;

function renderModeSeg() {
  $("#modeSeg").innerHTML = `<button data-m="choice" aria-pressed="${mode === "choice"}">四選一</button><button data-m="input" aria-pressed="${mode === "input"}">輸入數字</button>`;
}
$("#modeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.m === mode) return;
  mode = b.dataset.m; LS.set("cq_mode", mode); renderModeSeg();
  if (session && !session.answered) renderQuestion(true);
});

function renderQuestion(keep) {
  const s = session;
  if (!keep || !s.q) { s.q = nextQ(); s.cur = { it: s.q.it, opts: makeOptions(s.q.it) }; }
  const q = s.q, it = q.it;
  s.answered = false;
  renderModeSeg();
  const wait = s.pending.length;
  $("#qCount").textContent = q.retry ? `重考中 · ${s.oi} / ${ROUND}` : `${s.oi} / ${ROUND}${wait ? ` · 待重考 ${wait}` : ""}`;
  $("#progBar").style.width = `${progress(0)}%`;
  const answerArea = mode === "choice"
    ? `<div class="opts">${s.cur.opts.map((v, i) => `<button class="opt num" data-i="${i}">${v}</button>`).join("")}</div>`
    : `<form class="ans-form" id="ansForm" autocomplete="off"><input id="ansIn" class="field num ans-in" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="輸入佣金" enterkeyhint="done"><button class="btn" type="submit">確定</button></form>`;
  const badge = q.retry ? `<span class="tag retry">重考</span>` : q.review ? `<span class="tag retry">複習</span>` : "";
  $("#qBody").innerHTML = `
    <div class="qcard pop" style="--cc:${esc(it.c.color)}">
      <div class="row-between"><div class="carrier">${esc(it.c.name)}</div>${badge}</div>
      <div class="qplan">${esc(it.p.name)}</div>
      <div class="qtags"><span class="tag">${it.per} 期</span><span class="tag t${it.t}">${TYPES[it.t]}</span></div>
      <div class="qask">佣金是多少？</div>
    </div>
    ${answerArea}
    <div id="reveal"></div>`;
  $("#nextDock").classList.add("hidden");
  window.scrollTo(0, 0);
  if (mode === "input") {
    const inp = $("#ansIn");
    inp.focus({ preventScroll: true });
    $("#ansForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = inp.value.replace(/\D/g, "");
      if (!v || session.answered) return;
      answer(Number(v));
    });
  }
}
function rateTable(c, p, hl) {
  let h = `<table class="rt num"><thead><tr><th>期數</th>${TYPES.map((t) => `<th>${t}</th>`).join("")}</tr></thead><tbody>`;
  for (const per of PERIODS) {
    const r = p.rates[per];
    h += `<tr><td>${per} 期</td>`;
    for (let t = 0; t < 3; t++) {
      const v = r ? r[t] : null, isHl = hl && hl.per === per && hl.t === t;
      const it = v == null ? null : BYKEY[keyOf(c, p, per, t)];
      const tp = it && it.trap.length ? " tp" : "";
      h += v == null ? `<td class="na">—</td>` : `<td class="v${isHl ? " hl" : ""}${tp}">${v}</td>`;

$("#qBody").addEventListener("click", (e) => {
  const b = e.target.closest(".opt"); if (!b || session.answered) return;
  answer(session.cur.opts[Number(b.dataset.i)], Number(b.dataset.i));
});
document.addEventListener("keydown", (e) => {
  if ($("#quiz").classList.contains("hidden") || !session || !$("#sheetBg").classList.contains("hidden")) return;
  if (!session.answered && mode === "choice" && ["1", "2", "3", "4"].includes(e.key)) { const i = Number(e.key) - 1; answer(session.cur.opts[i], i); }
  else if (session.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); goNext(); }
});

/* ---------- 共通點說明 ----------
   作答後比較三家「同一個方案名稱」：這個類型有哪些期數、同一格各家多少、誰最高或數字相同。 */
function perLabel(pers) {
  if (!pers.length) return "";
  const idx = pers.map((p) => PERIODS.indexOf(p));
  const contiguous = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
  if (pers.length >= 3 && contiguous) return `${pers[0]}～${pers[pers.length - 1]} 期`;
  return `${pers.join("、")} 期`;
}
function commonNotes(it) {
  const notes = [], name = it.p.name, t = it.t, TN = TYPES[t];
  const short = (c) => CA_SHORT[c.id] || c.name;
  const holders = DATA.carriers.map((c) => ({ c, p: c.plans.find((p) => p.name === name) })).filter((x) => x.p);
  const persOf = (p) => PERIODS.filter((per) => p.rates[per] && p.rates[per][t] != null);
  const withT = holders.map((x) => ({ c: x.c, pers: persOf(x.p) })).filter((x) => x.pers.length);
  const noT = DATA.carriers.filter((c) => !withT.some((x) => x.c === c));
  // 1. 期數範圍
  if (withT.length === 1) {
    const pers = withT[0].pers, miss = PERIODS.filter((p) => !pers.includes(p));
    notes.push(`${esc(name)} 的${TN}只有<b>${short(withT[0].c)}</b>有，期數：${perLabel(pers)}${miss.length ? `（沒有 ${perLabel(miss)}）` : ""}`);
  } else if (withT.length > 1) {
    const same = withT.every((x) => x.pers.join() === withT[0].pers.join());
    const who = withT.length === DATA.carriers.length ? "三家" : withT.map((x) => short(x.c)).join("、");
    if (same) {
      const pers = withT[0].pers, miss = PERIODS.filter((p) => !pers.includes(p));
      notes.push(`${who}的 ${esc(name)} ${TN}${miss.length ? `都只有 <b>${perLabel(pers)}</b>，沒有 ${perLabel(miss)}` : "都有 24～48 期"}`);
    } else {
      notes.push(`${esc(name)} 的${TN}期數各家不同：${withT.map((x) => `${x.c === it.c ? "<b>" : ""}${short(x.c)} ${perLabel(x.pers)}${x.c === it.c ? "</b>" : ""}`).join("；")}`);
    }
    if (noT.length) notes.push(`${noT.map(short).join("、")}沒有 ${esc(name)} 的${TN}`);
  }
  // 2. 三家同一格比較
  const vals = holders.map((x) => ({ c: x.c, v: x.p.rates[it.per] ? x.p.rates[it.per][t] : null })).filter((x) => x.v != null);
  if (vals.length >= 2) {
    notes.push(`各家 ${esc(name)} ${it.per} 期${TN}：${vals.map((x) => (x.c === it.c ? `<b>${short(x.c)} ${x.v}</b>` : `${short(x.c)} ${x.v}`)).join("｜")}`);
    // 數字相同的各家（目前這家排前面）
    const groups = {};
    for (const x of vals) (groups[x.v] = groups[x.v] || []).push(x.c);
    const dup = Object.entries(groups).filter(([, cs]) => cs.length > 1);
    for (const [v, cs] of dup) {
      cs.sort((a, b) => (a === it.c ? -1 : b === it.c ? 1 : 0));
      notes.push(`${cs.map(short).join("和")}這格一樣都是 <b>${v}</b>`);
    }
    if (!dup.length && vals.length >= 3) {
      const mx = vals.reduce((a, b) => (b.v > a.v ? b : a)), mn = vals.reduce((a, b) => (b.v < a.v ? b : a));
      notes.push(`這格${short(mx.c)}最高、${short(mn.c)}最低`);
    }
  } else if (withT.length >= 2 && vals.length === 1) {
    const others = holders.filter((x) => x.c !== it.c).map((x) => short(x.c));
    notes.push(`${it.per} 期${TN}只有${short(it.c)}有，${others.join("、")}的 ${esc(name)} 沒有這格`);
  }
  return notes;
}

let autoTimer = null;
function answer(value, chosenIdx) {
  const s = session, { it, opts } = s.cur, q = s.q;
  s.answered = true;
  s.modes.add(mode);
  const ok = Number(value) === it.ans;
  if (q.retry) { s.retryAsk++; if (ok) s.retryOk++; }
  else {
    if (ok) s.firstOk++; else s.firstWrong.push(it);
    const st = itemStat[it.key] || [0, 0, 0];
    st[0]++; if (ok) st[1]++; st[2] = ok ? 1 : 0;
    itemStat[it.key] = st; LS.set("cq_item", itemStat);
  }
  let requeued = false;
  if (!ok) {
    const n = s.retryCount[it.key] || 0;
    if (n < RETRY_MAX) { s.retryCount[it.key] = n + 1; s.pending.push({ it, due: s.step + 1 + 3 + Math.floor(Math.random() * 3) }); requeued = true; }
  }
  if (mode === "choice" && chosenIdx !== undefined) {
    document.querySelectorAll(".opt").forEach((el, j) => {
      el.disabled = true;
      if (opts[j] === it.ans) el.classList.add("ok"); else if (j === chosenIdx) el.classList.add("ng"); else el.classList.add("dim");
    });
  } else {
    const inp = $("#ansIn"); if (inp) { inp.disabled = true; inp.classList.add(ok ? "ok" : "ng"); }
    const btn = document.querySelector("#ansForm .btn"); if (btn) btn.classList.add("hidden");
    if (document.activeElement) document.activeElement.blur();
  }
  const verdict = ok
    ? `<div class="verdict ok">✓ 答對了！　正確答案 <span class="num">${it.ans}</span></div>`
    : `<div class="verdict ng">✗ ${mode === "input" ? `你填 <span class="num">${value}</span>　` : ""}正確答案 <span class="num">${it.ans}</span></div>`;
  $("#reveal").innerHTML = `
    ${verdict}
    ${it.trap.length ? `<div class="trap"><b>⚠ 陷阱格</b>${it.trap.map((m) => `<div>${esc(m)}</div>`).join("")}</div>` : ""}
    ${(() => { const n = commonNotes(it); return n.length ? `<div class="common"><span class="ct">💡 共通點</span><ul>${n.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : ""; })()}
    ${requeued ? `<div class="hint" style="text-align:left;margin:0 2px 10px">這題稍後會再考一次</div>` : ""}

}

/* ---------- 結算、過關判定 ---------- */
function endRound() {
  const s = session, sc = s.scope;
  const pure = s.modes.size === 1 && s.modes.has("input");
  const mcode = s.modes.size > 1 ? "x" : s.modes.has("input") ? "i" : "c";
  hist.push({ at: Date.now(), c: s.firstOk, n: ROUND, w: s.firstWrong.map((it) => it.key), m: mcode, r: [s.retryOk, s.retryAsk], lv: sc.lv, ca: sc.ca, pl: sc.plan });
  LS.set("cq_hist", hist);
  // 過關：三家範圍、全程輸入數字模式、首答 18 題以上，連續兩輪
  let passMsg = "", justPassed = false;
  if (typeof sc.lv === "number") {
    const L = lvProg[sc.lv];
    if (sc.ca === "all" && pure) {
      if (s.firstOk >= PASS_SCORE) L.streak++; else L.streak = 0;
      if (!L.passed && L.streak >= PASS_STREAK) { L.passed = true; justPassed = true; }
      LS.set("cq_lv", lvProg);
      passMsg = L.passed && !justPassed ? `${LEVEL_NAME[sc.lv]}已過關` : `過關進度：連續 ${Math.min(L.streak, PASS_STREAK)} ／ ${PASS_STREAK} 輪達到 ${PASS_SCORE} 題以上`;
    } else if (!L.passed) {
      passMsg = sc.ca !== "all" ? "這輪是單一電信練習，不計入過關" : "這輪有使用四選一，不計入過關（過關需全程輸入數字）";
    }
  } else if (sc.lv === "plan") passMsg = "依資費練習不計入過關";
  const nextLv = sc.lv === 1 ? 2 : sc.lv === 2 ? 3 : "all";
  const pct = Math.round((s.firstOk / ROUND) * 100);
  const modeName = mcode === "x" ? "混合模式" : mcode === "i" ? "輸入數字" : "四選一";
  $("#summaryBody").innerHTML = `
    <div class="top"><div class="brand">本輪結果<small>${esc(scopeLabel(sc))}・${modeName}</small></div></div>
    ${justPassed ? `<div class="pass-banner">🎉 ${LEVEL_NAME[sc.lv]}過關！<small>已解鎖「${LEVEL_NAME[nextLv]}」${nextLv === "all" ? "，之後可以三層混合維持記憶" : "，之後每輪 14 題新內容＋6 題複習"}</small></div>` : ""}
    <div class="card pop"><div class="summary-score num"><b>${s.firstOk}<span style="font-size:24px"> / ${ROUND}</span></b><div>首次作答正確率 ${pct}%</div>
      ${s.retryAsk ? `<div style="margin-top:6px">重考 ${s.retryAsk} 題，答對 ${s.retryOk} 題</div>` : ""}</div>
      ${passMsg ? `<div class="prog-note">${passMsg}</div>` : ""}</div>
    ${justPassed ? `<button class="btn" id="sNext" style="margin-bottom:10px">前往${LEVEL_NAME[nextLv]}</button>` : ""}
    <button class="btn ${justPassed ? "ghost" : ""}" id="sAgain" style="margin-bottom:14px">再來一輪（20 題）</button>
    ${s.firstWrong.length ? `<div class="card"><p class="sec-title">這輪答錯（${s.firstWrong.length}）</p>${s.firstWrong.map(itemRow).join("")}</div>` : `<div class="card empty"><b>🎉</b>全部答對！</div>`}
    <button class="btn ghost" id="sHist">查看過往紀錄與層級進度</button>`;
  show("#summary");
  $("#sAgain").onclick = startRound;
  $("#sHist").onclick = () => renderHistory("#summary");
  const sn = $("#sNext"); if (sn) sn.onclick = () => { scope = { lv: nextLv, ca: "all" }; LS.set("cq_scope", scope); startRound(); };
}

/* ---------- 過往紀錄與層級進度 ---------- */

function renderHistory(from) {

    return `<details class="hist-item"><summary><span class="when num">${fmtTime(h.at)} ${sc} ${modeTag(h.m)}</span><span class="sc num">${h.c}/${h.n}</span><span class="pct ${cls} num">${p}%</span></summary>

/* ---------- 佣金計算機 ----------
   點選 電信 → 類型 → 期數 → 資費，立即顯示基本佣金、上線卡片與加碼、可勾選的加減項、合計、注意事項、三家同格比較。 */
const CT = { aq: "新辦", np: "攜碼", rt: "續約", fx: "固網成雙" };
let calc = LS.get("cq_calc", { ca: "twm", ty: "np", per: "24", plan: null, opt: {} });
const cCar = () => DATA.calc.carriers.find((c) => c.id === calc.ca) || DATA.calc.carriers[0];
const statusType = (st) => (st && st.includes("續約") ? "rt" : "aqnp");
function cPlans(c, ty) {
  if (ty === "fx") return (c.fixed || []).map((f) => ({ ...f, _fx: true }));
  const rank = (p) => (/^5G/.test(p.name) ? 0 : 1) * 1e6 - priceOf(p.name);
  return c.plans.filter((p) => (p[ty] && Object.keys(p[ty]).length) || (p.status && statusType(p.status) === (ty === "rt" ? "rt" : "aqnp")))
    .sort((a, b) => rank(a) - rank(b));
}
const cPeriods = (ty) => (ty === "fx" ? ["24", "36", "48"] : PERIODS);
function cVal(p, ty, per) {
  if (!p) return null;
  if (p._fx) { const a = p.aq[per], n = p.np[per]; return a == null && n == null ? null : { aq: a, np: n }; }
  return p[ty] && p[ty][per] != null ? p[ty][per] : null;
}
const hasVals = (p, ty) => p._fx || (p[ty] && Object.keys(p[ty]).length);
function cFix() {
  const c = cCar();
  if (calc.ty === "fx" && !c.fixed) calc.ty = "np";
  if (!cPeriods(calc.ty).includes(calc.per)) calc.per = cPeriods(calc.ty)[0];
  const plans = cPlans(c, calc.ty);
  const p = plans.find((x) => x.name === calc.plan);
  if (!p) { calc.plan = null; return; }
  if (hasVals(p, calc.ty) && cVal(p, calc.ty, calc.per) == null) {
    const first = cPeriods(calc.ty).find((per) => cVal(p, calc.ty, per) != null);
    if (first) calc.per = first;
  }
}
function saveCalc() { LS.set("cq_calc", calc); }

function openCalc() { clearTimeout(autoTimer); cFix(); renderCalc(); show("#calc"); }
function renderCalc() {
  const c = cCar(), ty = calc.ty, plans = cPlans(c, ty);
  const sel = plans.find((x) => x.name === calc.plan) || null;
  const btn = (attrs, pressed, label, sub, disabled, extraCls = "") =>
    `<button class="cbtn ${extraCls}" ${attrs} aria-pressed="${pressed}" ${disabled ? "disabled" : ""}>${label}${sub ? `<small>${sub}</small>` : ""}</button>`;
  const carRow = DATA.calc.carriers.map((x) => btn(`data-cca="${x.id}"`, x.id === calc.ca, esc(CA_SHORT[x.id] || x.name), "", false, `c-${x.id}`)).join("");
  const tys = ["aq", "np", "rt"].concat(c.fixed ? ["fx"] : []);
  const tyRow = tys.map((t) => btn(`data-cty="${t}"`, t === ty, CT[t], "", false)).join("");
  const perRow = cPeriods(ty).map((per) => {
    // 任何方案都沒有的期數才鎖住；目前方案沒有的期數仍可點（會取消方案，改看該期數各方案）
    const any = plans.some((p) => cVal(p, ty, per) != null);
    const selHas = !(sel && hasVals(sel, ty)) || cVal(sel, ty, per) != null;
    return btn(`data-cper="${per}"`, per === calc.per, `${per} 期`, "", !any, any && !selHas ? "dim" : "");
  }).join("");
  const planRow = plans.map((p) => {
    const v = cVal(p, ty, calc.per);
    let sub = "";
    if (p.status && !hasVals(p, ty)) sub = esc(p.status.replace(/^(新辦／攜碼|續約)/, "") || p.status);
    else if (v == null) sub = "無此期數";
    else sub = p._fx ? `${v.aq ?? "—"}／${v.np ?? "—"}` : String(v);
    // 這個期數沒有的方案仍可點，點了會自動切到它有的期數
    return btn(`data-cpl="${esc(p.name)}"`, p.name === calc.plan, esc(p.name), sub, false, hasVals(p, ty) && v == null ? "dim" : "");
  }).join("");
  $("#calcBody").innerHTML = `
    <div class="row-between" style="margin-bottom:8px"><button class="back" id="calcBack">‹ 回${appMode === "plan" ? "資費默寫" : "測驗"}</button><span class="pill">${esc(c.name)} ${esc(c.date || "")}</span></div>
    <div class="brand" style="margin-bottom:12px">佣金計算機</div>
    <div class="calc-row"><p class="sec-title">電信</p><div class="calc-grid g3">${carRow}</div></div>
    <div class="calc-row"><p class="sec-title">類型</p><div class="calc-grid g${tys.length}">${tyRow}</div></div>
    <div class="calc-row"><p class="sec-title">期數</p><div class="calc-grid g${cPeriods(ty).length}">${perRow}</div></div>
    <div class="calc-row"><p class="sec-title">資費${ty === "fx" ? "（台哥大資費・新辦／攜碼）" : ""}</p><div class="calc-grid g3">${planRow}</div></div>
    <div id="calcResult">${calcResult(c, sel)}</div>`;
}

function calcResult(c, p) {
  if (!p) return `<div class="card empty" style="padding:20px">點選上方資費，就會顯示佣金與注意事項</div>`;
  const ty = calc.ty, per = calc.per, o = calc.opt || {};
  const head = `<div class="res-head"><span class="carrier" style="--cc:${esc(c.color)}">${esc(c.name)}</span><b>${esc(p.name)}</b><span class="tag">${per} 期</span><span class="tag">${CT[ty]}</span></div>`;
  const rules = ((c.rules || {})[ty === "rt" ? "rt" : ty === "fx" ? "fixed" : "aqnp"] || []);
  const notesBox = (extra) => {
    const all = extra.concat(rules);
    return all.length ? `<div class="card notes"><p class="sec-title">注意事項</p><ul>${all.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : "";
  };
  // 固網成雙
  if (p._fx) {
    const v = cVal(p, ty, per);
    return `<div class="card res-card">${head}
      <div class="res-two num"><div><span>新辦</span><b>${v ? v.aq ?? "X" : "X"}</b></div><div><span>攜碼</span><b>${v ? v.np ?? "X" : "X"}</b></div></div>
      <div class="res-line"><span>固網速度</span><b>${esc(p.speed)}</b></div></div>
      ${notesBox(per === "48" && !v ? ["此資費 48 個月不開放"] : [])}`;
  }
  // 停開、洗機後報價等沒有金額的方案
  if (!hasVals(p, ty)) {
    const adjInfo = p.adj ? adjInfoLines(p.adj) : [];
    return `<div class="card res-card">${head}<div class="res-status">${esc(p.status || "不開放")}</div>
      ${adjInfo.length ? `<p class="sec-title" style="margin-top:12px">表上加減項</p>${adjInfo.map((l) => `<div class="res-line"><span>${l[0]}</span><b class="num">${l[1]}</b></div>`).join("")}` : ""}</div>
      ${notesBox(p.note ? [esc(p.note)] : [])}`;
  }
  const base = cVal(p, ty, per);
  const lines = [];
  const extraNotes = [];
  let total = base;
  // 上線卡片與卡片加碼
  const cd = p.card && p.card[`${ty}${per}`];
  let cardHtml = "";
  if (cd) {
    const [card, bonus, note] = cd;
    cardHtml = `<div class="res-line"><span>上線卡片</span><b>${esc(card)}${note ? `<small class="cnote">${esc(note)}</small>` : ""}</b></div>`;

      toggles.push(`<div class="tg-ren"><span>續約型態</span><div class="seg" id="renSeg">${[["none", "一般"], ["up", `升續 +${adj.up}`], ["flat", `平續 ${adj.flat}`], ["down", `降續 ${adj.down}`]].map(([v, l]) => `<button data-ren="${v}" aria-pressed="${k === v}">${l}</button>`).join("")}</div>
        ${k === "up" ? `<small class="warn-txt">⚠ 表上註明「不認列升續加碼」，升續加碼是否發放請以主管說明為準</small>` : ""}</div>`);
      if (k !== "none") { lines.push([{ up: "升續", flat: "平續", down: "降續" }[k], amt, false]); total += amt; }
    }
  }
  if (c.id === "twm" || c.id === "fet") tg("paper", ty === "rt" ? "有紙" : "有紙回件", -500, "公司戶或店內無條碼時除外");
  // 三家同格比較
  const cmp = DATA.calc.carriers.map((x) => {
    const q = x.plans.find((pp) => pp.name === p.name);
    const v = q && q[ty] ? q[ty][per] : null;
    return v == null ? null : `${x.id === c.id ? "<b>" : ""}${esc(CA_SHORT[x.id])} ${v}${x.id === c.id ? "</b>" : ""}`;
  }).filter(Boolean);
  return `<div class="card res-card">${head}
      <div class="res-base"><span>基本佣金</span><b class="num">${base}</b></div>
      ${cardHtml}
      ${lines.map(([l, a]) => `<div class="res-line"><span>${l}</span><b class="num ${a < 0 ? "neg" : "pos"}">${a > 0 ? "+" : ""}${a}</b></div>`).join("")}
      <div class="res-total"><span>合計</span><b class="num">${total}</b></div>
    </div>
    ${toggles.length ? `<div class="card"><p class="sec-title">加減項（依實際情況勾選）</p>${toggles.join("")}</div>` : ""}
    ${notesBox(extraNotes)}
    ${cmp.length >= 2 ? `<div class="card"><p class="sec-title">三家同格比較（${esc(p.name)}・${per} 期${CT[ty]}）</p><div class="cmp num">${cmp.join("｜")}</div></div>` : ""}`;
}
function adjInfoLines(a) {

/* ==========================================================
   資費默寫：每題一個方案，把商品折扣、預繳、傳輸量、網內、網外、市話默寫出來
   ========================================================== */
const P_ROUND = 10;
let appMode = LS.get("cq_app", "comm");                 // comm：佣金測驗｜plan：資費默寫
let pScope = LS.get("cq_pscope", { ca: "all", net: "5G", price: null });
let pHist = LS.get("cq_phist", []);
let PITEMS = [], pSession = null;
const PRICES = [599, 799, 999, 1199, 1399];

function buildPItems() {
  PITEMS = [];
  if (!DATA.plans) return;
  for (const g of DATA.plans.groups) {
    const c = DATA.carriers.find((x) => x.id === g.c);
    for (const x of g.items) PITEMS.push({ ...x, key: `${g.c}|${g.ty}|${x.name}`, c, ty: g.ty, net: g.net });
  }
}
function pFields(it) {
  const f = [];
  const money = (k, label) => (it[k] === "洽" ? f.push({ k, label, info: "請洽門市" }) : f.push({ k, label, kind: "num", ans: it[k], unit: "元" }));
  money("disc", "商品折扣"); money("pre", "預繳");
  f.push({ k: "data", label: "傳輸量", kind: "choice", ans: it.data });
  f.push({ k: "on", label: "網內", kind: "choice", ans: it.on });
  f.push({ k: "off", label: "網外", kind: "num", ans: it.off, unit: "分鐘" });
  if (it.land != null) f.push({ k: "land", label: "市話", kind: "num", ans: it.land, unit: "分鐘" });
  if (it.extra) f.push({ k: "extra", label: it.extra[0], kind: "num", ans: it.extra[1], unit: "元" });
  return f;
}
function pOptions(it, k) {
  const ans = it[k];
  const vals = (net) => [...new Set(PITEMS.filter((x) => (!net || x.net === net) && x[k] !== ans).map((x) => x[k]))];
  let pool = shuffle(vals(it.net));
  if (pool.length < 3) pool = pool.concat(shuffle(vals(null).filter((v) => !pool.includes(v))));
  return shuffle([ans, ...pool.slice(0, 3)]);
}
function pPool(sc) {
  return PITEMS.filter((it) => (sc.price ? it.price === sc.price && it.net === "5G" : (sc.ca === "all" || it.c.id === sc.ca) && (sc.net === "all" || it.net === sc.net)));
}
const pScopeLabel = (sc) => (sc.price ? `5G ${sc.price}・三家` : `${CA_SHORT[sc.ca]}・${sc.net === "all" ? "4G＋5G" : sc.net}`);
// 各電信輪流、相鄰題目盡量不同電信與期數
function pBuild(pool, n) {
  const byC = new Map();
  for (const it of shuffle(pool)) { if (!byC.has(it.c.id)) byC.set(it.c.id, []); byC.get(it.c.id).push(it); }
  const qs = shuffle([...byC.values()]), out = [];
  while (out.length < Math.min(n, pool.length)) for (const q of qs) if (q.length && out.length < n) out.push(q.shift());
  let rest = shuffle(out); const res = [];
  while (rest.length) {
    const prev = res[res.length - 1];
    let i = prev ? rest.findIndex((x) => x.c !== prev.c && x.per !== prev.per) : 0;
    if (i < 0) i = rest.findIndex((x) => x.c !== prev.c);
    if (i < 0) i = 0;
    res.push(rest.splice(i, 1)[0]);
  }
  return res;
}

function setApp(m) {
  appMode = m; LS.set("cq_app", m);
  if (m === "notes") { renderNotes(); show("#notes"); }
  else if (m === "plan") { if (!pSession) startPRound(); else { show("#pquiz"); if (pSession.answered) $("#pNextDock").classList.remove("hidden"); } }
  else { show("#quiz"); if (session && session.answered) $("#nextDock").classList.remove("hidden"); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-app]"); if (b && b.dataset.app !== appMode) setApp(b.dataset.app); });
const appSeg = (m) => `<div class="seg app-seg"><button data-app="comm" aria-pressed="${m === "comm"}">佣金測驗</button><button data-app="plan" aria-pressed="${m === "plan"}">資費默寫</button><button data-app="notes" aria-pressed="${m === "notes"}">重點講義</button></div>`;

function startPRound() {
  const pool = pPool(pScope);
  pSession = { scope: { ...pScope }, list: pBuild(pool, P_ROUND).map((it) => ({ it, retry: false })), idx: 0, fc: 0, fn: 0, perfect: 0, wrong: [], answered: false, retried: {} };
  $("#pScopeTxt").textContent = pScopeLabel(pScope);
  show("#pquiz");
  renderPQ();
}
function renderPQ() {
  const s = pSession, q = s.list[s.idx], it = q.it;
  s.answered = false; s.sel = {};
  s.fields = pFields(it);
  s.opts = {};
  s.fields.filter((f) => f.kind === "choice").forEach((f) => (s.opts[f.k] = pOptions(it, f.k)));
  const origN = s.list.filter((x) => !x.retry).length, origDone = s.list.slice(0, s.idx).filter((x) => !x.retry).length;
  $("#pCount").textContent = q.retry ? `重考中 · ${origDone} / ${origN}` : `${origDone + 1} / ${origN}`;
  $("#pProg").style.width = `${(s.idx / s.list.length) * 100}%`;
  const rows = s.fields.map((f, i) => {
    if (f.info) return `<div class="pf-row"><label>${f.label}</label><div class="pf-info">${f.info}</div></div>`;
    if (f.kind === "num") return `<div class="pf-row" data-row="${f.k}"><label>${f.label}</label><div class="pf-num"><input class="field num" data-k="${f.k}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next"><span>${f.unit}</span></div><div class="pf-res"></div></div>`;
    return `<div class="pf-row" data-row="${f.k}"><label>${f.label}</label><div class="pf-chips">${s.opts[f.k].map((v, j) => `<button type="button" class="pchip" data-k="${f.k}" data-j="${j}">${esc(v)}</button>`).join("")}</div><div class="pf-res"></div></div>`;
  }).join("");
  $("#pBody").innerHTML = `
    <div class="qcard pop" style="--cc:${esc(it.c.color)}">
      <div class="row-between"><div class="carrier">${esc(it.c.name)}</div>${q.retry ? `<span class="tag retry">重考</span>` : ""}</div>
      <div class="qplan" style="font-size:28px">${esc(it.name)}</div>
      <div class="qtags"><span class="tag">${esc(it.ty)}</span><span class="tag">${it.net}</span>${it.student ? `<span class="tag t2">學生</span>` : ""}</div>
    </div>
    <form id="pForm" class="card pform" autocomplete="off">${rows}
      <button class="btn" type="submit" id="pSubmit" style="margin-top:12px">送出批改</button></form>
    <div id="pReveal"></div>`;
  $("#pNextDock").classList.add("hidden");
  window.scrollTo(0, 0);
  const first = document.querySelector("#pForm input"); if (first) first.focus({ preventScroll: true });
}
$("#pBody").addEventListener("click", (e) => {
  const b = e.target.closest(".pchip"); if (!b || pSession.answered) return;
  pSession.sel[b.dataset.k] = Number(b.dataset.j);
  document.querySelectorAll(`.pchip[data-k="${b.dataset.k}"]`).forEach((x) => x.setAttribute("aria-pressed", x === b));
});
$("#pBody").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.matches("#pForm input")) return;
  const ins = [...document.querySelectorAll("#pForm input")], i = ins.indexOf(e.target);
  if (i < ins.length - 1) { e.preventDefault(); ins[i + 1].focus(); }
});
$("#pBody").addEventListener("submit", (e) => { e.preventDefault(); if (!pSession.answered) gradeP(); });

function gradeP() {
  const s = pSession, q = s.list[s.idx], it = q.it;
  s.answered = true;
  let ok = 0, n = 0;
  for (const f of s.fields) {
    if (f.info) continue;
    n++;
    const row = document.querySelector(`[data-row="${f.k}"]`);
    let right, shown;
    if (f.kind === "num") {
      const inp = row.querySelector("input"); const v = inp.value.replace(/\D/g, "");
      right = v !== "" && Number(v) === Number(f.ans); shown = v === "" ? "（空白）" : v;
      inp.disabled = true; inp.classList.add(right ? "ok" : "ng");
    } else {
      const j = s.sel[f.k]; right = j != null && s.opts[f.k][j] === f.ans;
      row.querySelectorAll(".pchip").forEach((x, xi) => { x.disabled = true; if (s.opts[f.k][xi] === f.ans) x.classList.add("ok"); else if (xi === j) x.classList.add("ng"); });
    }
    if (right) ok++;
    row.querySelector(".pf-res").innerHTML = right ? `<span class="okt">✓</span>` : `<span class="ngt">✗ 正確：${esc(f.ans)}${f.unit && f.kind === "num" ? " " + f.unit : ""}</span>`;
  }
  const perfect = ok === n;
  if (!q.retry) { s.fc += ok; s.fn += n; if (perfect) s.perfect++; else s.wrong.push(it); }
  let requeued = false;
  if (!perfect && !q.retry && !s.retried[it.key]) {
    s.retried[it.key] = true;
    s.list.splice(Math.min(s.idx + 3 + Math.floor(Math.random() * 2), s.list.length), 0, { it, retry: true });
    requeued = true;
  }
  $("#pSubmit").classList.add("hidden");
  $("#pReveal").innerHTML = `
    <div class="verdict ${perfect ? "ok" : "ng"}">${perfect ? "✓ 全部正確！" : `答對 ${ok}／${n} 欄`}</div>
    ${requeued ? `<div class="hint" style="text-align:left;margin:0 2px 10px">這題稍後會再考一次</div>` : ""}
    ${it.note ? `<div class="trap"><b>⚠ 注意</b><div>${esc(it.note)}</div></div>` : ""}
    ${pCompare(it)}`;
  $("#pProg").style.width = `${((s.idx + 1) / s.list.length) * 100}%`;
  $("#pNextBtn").textContent = s.idx + 1 >= s.list.length ? "看結果" : "下一題";
  $("#pNextDock").classList.remove("hidden");
}
// 共通點：同資費、同期數的各家（含攜碼／新申辦）比較
function pCompare(it) {
  const ids = ["cht", "twm", "fet"];
  const cols = ids.map((id) => {
    const cands = PITEMS.filter((x) => x.c.id === id && x.price === it.price && x.per === it.per && x.net === it.net && !!x.student === !!it.student && x.name.includes("12.3GB") === it.name.includes("12.3GB"));
    return cands.find((x) => x.ty === it.ty) || cands.find((x) => x.ty === "攜碼") || null;
  });
  if (cols.filter(Boolean).length < 2) return "";
  const fmt = (v) => (v === "洽" ? "洽門市" : v);
  const row = (label, fn) => {
    const vals = cols.map((x) => (x ? String(fn(x)) : null)), cls = rowClasses(vals);
    return `<tr><td class="rh">${label}</td>${cols.map((x, i) => `<td class="${cls[i]}${x === it ? " mecol" : ""}">${x ? fn(x) : "—"}</td>`).join("")}</tr>`;
  };
  return `<div class="card"><p class="sec-title">💡 同位置對照：${esc(String(it.price))}（${it.per}）${it.student ? "學生" : ""}</p>

      ${row("商品折扣", (x) => fmt(x.disc))}${row("預繳", (x) => fmt(x.pre))}${row("傳輸量", (x) => shortData(x.data))}${row("網內", (x) => esc(x.on))}${row("網外", (x) => x.off)}${cols.some((x) => x && x.land != null) ? row("市話", (x) => (x.land != null ? x.land : "—")) : ""}
    </tbody></table><div class="vg-note">框起來的是這題；淡色＝和別家相同、黃底＝台哥大和遠傳不同${it.ty === "新申辦" ? "；中華、台哥大沒有新申辦報價，以攜碼對照" : ""}</div></div>`;
}
function nextP() {
  const s = pSession; if (!s || !s.answered) return;

}
$("#pNextBtn").addEventListener("click", nextP);

function endPRound() {

function pRow(it) {

function planCell(id, price, per) {

// 依「三家是否相同」決定每格底色：eq3 三家相同｜eq2 和某家相同｜hl 台哥大與遠傳不同｜na 沒有
function rowClasses(vals) {
  const has = vals.map((v) => v != null);
  return vals.map((v, i) => {
    if (v == null) return "na";
    if (has.every(Boolean) && vals[0] === vals[1] && vals[1] === vals[2]) return "eq3";
    if (vals.some((x, j) => j !== i && x != null && x === v)) return "eq2";
    if (i > 0 && has[1] && has[2] && vals[1] !== vals[2]) return "hl";
    return "";
  });
}

}

/* ---------- 佣金總表：資費 × 期數，每格由上到下固定 中、台、遠 ---------- */
function commGrid(t, opts = {}) {
  const hl = opts.hl || null;
  let names = [...new Set(ITEMS.filter((it) => it.t === t).map((it) => it.p.name))].sort((a, b) => priceOf(a) - priceOf(b));
  if (opts.prices) names = names.filter((n) => opts.prices.includes(priceOf(n)));
  const pers = opts.pers || PERIODS;
  const max = Math.max(...ITEMS.filter((it) => it.t === t).map((it) => it.ans));
  const rows = names.map((n) => {
    const cells = pers.map((per) => {
      const vals = CAR_ORDER.map((id) => BYKEY[`${id}|${n}|${per}|${t}`] || null);
      if (vals.every((v) => !v)) return `<td class="na"></td>`;
      const nums = vals.map((v) => (v ? v.ans : null)), got = nums.filter((x) => x != null);
      const heat = Math.round((got.reduce((a, b) => a + b, 0) / got.length / max) * 100);
      const lines = vals.map((v, i) => {
        if (!v) return `<div class="ln l-${CAR_ORDER[i]} miss">·</div>`;
        const eq = nums.some((x, j) => j !== i && x === v.ans);
        return `<div class="ln l-${CAR_ORDER[i]}${eq ? " eq" : ""}${v.trap.length ? " tp" : ""}${hl && hl.key === v.key ? " me" : ""}">${v.ans}</div>`;
      }).join("");
      const inHl = hl && vals.some((v) => v && v.key === hl.key);
      return `<td class="cm${inHl ? " cur" : ""}" style="--heat:${heat}">${lines}</td>`;
    }).join("");
    return `<tr${hl && hl.p.name === n ? ' class="currow"' : ""}><td class="rh">${esc(n.replace("5G-", ""))}</td>${cells}</tr>`;
  }).join("");
  return `<table class="vg cmg"><thead><tr><th class="rh"></th>${pers.map((p) => `<th class="ph">${p} 期</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
}

      const open = l.id === nOpen;
      return `<div class="lesson${open ? " open" : ""}${nRead[l.id] ? " read" : ""}" data-lid="${l.id}">
        <button class="lesson-h" data-nopen="${l.id}"><span class="lno">${i + 1}</span><span class="lt"><small>${l.lv}</small>${esc(l.title)}</span><span class="lst">${nRead[l.id] ? "✓" : open ? "▾" : "▸"}</span></button>
        ${open ? `<div class="lesson-b">
          <div class="keybox"><b>本課重點</b><ol>${l.key.map((k) => `<li>${esc(k)}</li>`).join("")}</ol></div>
          <div class="memo">🧠 ${esc(l.memo)}</div>
          <label class="switch" style="margin:8px 0 6px"><span>遮住數字自我檢查（點格子顯示）</span><input type="checkbox" data-ncover="${l.id}" ${nCover[l.id] ? "checked" : ""}></label>
          <div class="lesson-body${nCover[l.id] ? " covered" : ""}">${l.body}</div>
          <div class="lesson-f">${goBtn(l)}<button class="btn sm ${nRead[l.id] ? "ghost" : ""}" data-nread="${l.id}">${nRead[l.id] ? "標為未讀" : "讀完了，下一課 ›"}</button></div>
        </div>` : ""}
      </div>`;
    }).join("")}`;
}
document.addEventListener("click", (e) => {
  if ($("#notes").classList.contains("hidden")) return;
  const td = e.target.closest(".lesson-body.covered td:not(.rh):not(.na)");
  if (td) { td.classList.toggle("rev"); return; }
  const b = e.target.closest("[data-ntab],[data-ntype],[data-nopen],[data-nread],[data-ngo]");
  if (!b || b.disabled) return;
  const y = window.scrollY;
  if (b.dataset.ntab) { nTab = b.dataset.ntab; LS.set("cq_ntab", nTab); nOpen = null; renderNotes(); window.scrollTo(0, 0); return; }
  if (b.dataset.ntype) { nType = Number(b.dataset.ntype); LS.set("cq_ntype", nType); }
  if (b.dataset.nopen) nOpen = nOpen === b.dataset.nopen ? "" : b.dataset.nopen;
  if (b.dataset.nread) {
    const id = b.dataset.nread; nRead[id] = !nRead[id]; LS.set("cq_nread", nRead);
    if (nRead[id]) { const ls = nTab === "plan" ? planLessons() : commLessons(); const i = ls.findIndex((l) => l.id === id); nOpen = (ls[i + 1] || {}).id || ""; }
    renderNotes();
    const el = document.querySelector(".lesson.open"); if (el) el.scrollIntoView({ block: "start" }); else window.scrollTo(0, y);
    return;
  }
  if (b.dataset.ngo) {
    const l = (nTab === "plan" ? planLessons() : commLessons()).find((x) => x.id === b.dataset.ngo);
    if (l.go.plan) { pScope = { ...l.go.plan }; LS.set("cq_pscope", pScope); appMode = "plan"; LS.set("cq_app", "plan"); startPRound(); }
    else { scope = { lv: l.go.comm, ca: "all" }; LS.set("cq_scope", scope); appMode = "comm"; LS.set("cq_app", "comm"); startRound(); }
    return;
  }
  renderNotes();
  if (b.dataset.nopen) { const el = document.querySelector(".lesson.open"); if (el) el.scrollIntoView({ block: "start" }); else window.scrollTo(0, y); }
  else window.scrollTo(0, y);
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset && e.target.dataset.ncover; if (!k) return;
  nCover[k] = e.target.checked;
  const body = e.target.closest(".lesson-b").querySelector(".lesson-body");
  body.classList.toggle("covered", nCover[k]); body.querySelectorAll("td.rev").forEach((x) => x.classList.remove("rev"));
});


boot();
})();
</script>
</body>
</html>
